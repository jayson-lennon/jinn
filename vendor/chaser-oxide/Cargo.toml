[lints]
# Upstream ships against stock clippy, not this workspace's deny list;
# carving the workspace-only denies out here (instead of patching 119
# upstream sites) keeps the vendored source byte-comparable to the
# crates.io tarball except for the documented stealth patches. The
# workspace lint set is repeated because Cargo forbids inheriting
# `lints.workspace` while overriding entries.
[lints.rust]
