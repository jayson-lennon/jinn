# nullslop provider configuration
# Configure the providers you want to use.
# The active provider can be changed at runtime via the picker UI.
#
# API keys are never stored here — reference env var names instead.
# For providers that don't require a key (Ollama, LMStudio), set requires_key = false.
# Each provider is a map-keyed table: [providers.<name>]. The table name IS the
# provider name — nested tables (extra_body, model_info) are part of the key path,
# so [providers.zai.extra_body] unambiguously belongs to zai.
# Need different settings for the same backend? Add another table with a unique name.

[providers.openrouter]
backend = "openrouter"
api_key_env = "OPENROUTER_API_KEY"
models = ["openai/gpt-oss-120b", "anthropic/claude-sonnet-4-20250514", "google/gemini-2.5-flash"]
model_info = []
requires_key = true

# renamed from "llama.cpp" — dotted names cannot be map keys
[providers.llamacpp]
backend = "openai"
requires_key = false
base_url = "http://127.0.0.1:8089/v1"
models = ["/mnt/zed/repos/ai-models/Qwen3.6-35B-A3B-MTP-UD-Q4_K_XL.gguf", "/home/jayson/.lmstudio/models/lmstudio-community/Bonsai-27B-GGUF.Bonsai-27B-Q1_0.gguf", "/mnt/zed/work/youtube/videos/2026-08-14-showcase-bonsai-27b/model/Ternary-Bonsai-27B-Q2_g64.gguf"]

