jinn-cell-catalog = { workspace = true }
jinn-core-types = { workspace = true }
jinn-llm-support = { workspace = true }
jinn-app-state = { workspace = true }
jinn-session-history-msg = { workspace = true }
jinn-context = { workspace = true }
jinn-picker = { workspace = true }
jinn-context-curation-msg = { workspace = true }
jinn-context-assembly-msg = { workspace = true }
jinn-tools-msg = { workspace = true }
