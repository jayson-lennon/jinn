jinn-config = { workspace = true }
jinn-session-msg = { workspace = true }
jinn-session-state = { workspace = true }
jinn-provider = { workspace = true }
jinn-provider-config = { workspace = true }


# External deps
serde = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
derive_more = { workspace = true }
ratatui-which-key = { workspace = true }
uuid = { workspace = true }
ratatui = { workspace = true }
async-trait = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
throbber-widgets-tui = { workspace = true }
parking_lot = { workspace = true }
libc = { workspace = true }
kanal = { workspace = true }
rand = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }

# Actor framework

# Actor canvas runtime hosting the jinn slice actors
trouper = { workspace = true }

[dev-dependencies]
jinn-context-assembly = { workspace = true }
jinn-context-curation = { workspace = true }
# The phase-command tests spawn the real phase actor at its production
# path to verify the ask round-trip. Dev-only on purpose: a production
# edge to the slice would invert the kernel→slice direction.
jinn-session-turn = { workspace = true }
# Enables the schema crate's migration-chain helpers. The `testing` feature is
# unified into `jinn-session-schema`'s own integration tests, which is why this
# dev-dep cannot be dropped while those tests live in that crate.
jinn-session-schema = { workspace = true, features = ["testing"] }
indoc = "2"
rstest = { workspace = true }
jinn-mcp = { workspace = true, features = ["testkit", "server-testkit"] }
tokio = { workspace = true, features = ["test-util"] }
jinn-common = { workspace = true, features = ["testing"] }
ctor = "0.8"
rustls = { workspace = true }
tracing-subscriber = { workspace = true }
# The install test scans a freshly-installed skills dir. Dev-only on purpose: a
# production edge to `jinn-skills` would forbid that slice from depending on
# the kernel, which is exactly what the slice-owned skill picker needs.
jinn-skills = { workspace = true }


[target.'cfg(windows)'.dependencies]
# kill_tree provides Toolhelp32-based process-tree termination on Windows.
# Used by `common::process_kill` as the Windows counterpart to Unix's
# process-group kill. Only the default `blocking` feature is needed;
# the `tokio` feature is intentionally NOT enabled because kill-on-drop
# runs synchronously from a `Drop` impl (no async runtime context).
kill_tree = "0.2"

[lints]
workspace = true

# [lints.clippy]
# pedantic = { level = "warn", priority = -1 }
# result_large_err = "allow"
# field_scoped_visibility_modifiers = "allow"
# module_inception = "allow"
# must_use_candidate = "allow"
# missing_docs_in_private_items = "allow"
# doc_markdown = "allow"
# cast_possible_truncation = "allow"
# cast_sign_loss = "allow"
# cast_possible_wrap = "allow"
# return_self_not_must_use = "allow"
# single_match = "allow"
# struct_excessive_bools = "allow"
# needless_raw_string_hashes = "allow"
