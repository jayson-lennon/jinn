[package]
name = "jinn-dictation-backend-parakeet"
version.workspace = true
edition.workspace = true
description = "The real dictation backend: NVIDIA Parakeet TDT 0.6B v2 (int8 ONNX) via sherpa-onnx, with Silero VAD endpointing, nnnoiseless denoising, and hf-hub model fetch into jinn's own cache."

# This crate sits outside every workspace member glob (`crates/jinn-*`,
# `crates/slices/*`, `vendor/*`) on purpose: its native dependencies
# (sherpa-onnx, nnnoiseless) compile only on linux and windows targets
# (sherpa-onnx via prebuilt platform libs), so a glob that swept this
# directory would break `just check` on every other platform. It enters
# the build only through the dictation slice's linux-and-windows
# target-scoped dependency tables; its code is exercised on linux by
# `just check` / `just test` and on windows by `just check`'s xwin leg,
# through that same edge.

[dependencies]
jinn-dictation-backend = { workspace = true }
jinn-common = { workspace = true }
marked-path = { workspace = true }
error-stack = { workspace = true }
wherror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
hf-hub = { workspace = true }
nnnoiseless = "0.5"
# The VAD file downloads from the sherpa-onnx GitHub release assets;
# the model repo on HuggingFace does not carry it.
ureq = { version = "3", features = ["rustls"] }
# Static linking by default: the binary stays self-contained (the
# same distribution shape the release tgz ships).
sherpa-onnx = { version = "2.0", default-features = false, features = ["static"] }
# The feature-config type lives in the sys crate; pinned to the same
# version sherpa-onnx pulls so the two cannot disagree.
sherpa-onnx-sys = { version = "=2.0.1", default-features = false, features = ["static"] }

[dev-dependencies]
rstest = { workspace = true }

[lints]
workspace = true
