# Kernel dep: the orchestrator builds `ToolContext`, whose state and
# preference reads (skills discovery, task model selection, term spawn size,
# project command-policy resolution) are kernel type reads — the discord
# precedent for a slice consuming kernel vocabulary at execution time.
jinn-kernel = { workspace = true }
jinn-llm-support = { workspace = true }
# `read_image` attaches through the shared `Attachment` type and resolves its
# vision gate against models.dev reference data.
jinn-provider = { workspace = true }
jinn-provider-config = { workspace = true }
jinn-context-assembly = { workspace = true }
jinn-session-turn = { workspace = true }

jinn-session-init-msg = { workspace = true }

[dev-dependencies]
# `spawned_shell_runs_in_new_session` reads the shell's session id with
# `getsid(2)` — the one portable way, since `ps` session keywords differ
# between procps (`sid`) and BSD (`sess`, which reports 0).
libc = { workspace = true }
# `activate_picker` resolves the picker cells the catalog owns, so the test
# harnesses seed their registry through the same list production boot uses.
jinn-cell-catalog = { workspace = true }
jinn-testutil = { workspace = true }
# The denial tests build a real compiled rule set to install into the
# stream-rules cell. Production only ever speaks the `jinn-slices` vocabulary,
# so this stays a dev-dependency rather than a crate edge -- same reasoning as
# jinn-inference's dev-dependency on the same crate.
jinn-stream-rules = { workspace = true }

toml = { workspace = true }
jinn-token-count-msg = { workspace = true }
async-trait = { workspace = true }
tempfile = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true }

