[package]
name = "jinn-session-store"
version.workspace = true
edition.workspace = true
description = """
The session-store slice: session persistence/restoration actor, SQLite backend,
and background FTS search-index maintenance actor.

Kernel dependency: the shared `SessionStore` service seam and `State` live in
`jinn-kernel`; session snapshots and reconstruction
contracts come from `jinn-session-state`.
"""

[dependencies]
marked-path = { workspace = true }
jinn-chat-log-view = { workspace = true }
jinn-kernel = { workspace = true }
jinn-core-types = { workspace = true }
jinn-provider = { workspace = true }
jinn-provider-config = { workspace = true }
jinn-common = { workspace = true }
jinn-session-schema = { workspace = true }
jinn-session-list = { workspace = true }
jinn-session-msg = { workspace = true }
jinn-session-state = { workspace = true }
jinn-session-store-msg = { workspace = true }
jinn-bot-msg = { workspace = true }
jinn-chat-input-msg = { workspace = true }
jinn-chat-log-view-msg = { workspace = true }
jinn-token-count-msg = { workspace = true }
# The work-time cell, read at the two points a durable copy of a session's
# working intervals is stamped. Read-only: the monitor is the sole writer.
jinn-work-time-msg = { workspace = true }
jinn-tools-msg = { workspace = true }
jinn-slices = { workspace = true }
# The startup seed normalizes the persisted persona against the persona
# slice's catalog cell. Read-only.
jinn-persona-msg = { workspace = true }
# The status bar's hint cell, so a failed archive reaches the screen
# instead of leaving the keypress looking like a no-op.
jinn-status-bar-msg = { workspace = true }
jinn-boot-msg = { workspace = true }
jinn-session-lifecycle-msg = { workspace = true }
jinn-mcp-msg = { workspace = true }
jinn-preferences-config = { workspace = true }
# The maintenance actor reads the [maintenance] section (session retention).
jinn-config = { workspace = true }
jinn-picker = { workspace = true }
daow = { workspace = true }
rusqlite = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
# The search-index actor runs on the trouper fabric (actor-migration big bang).
serde = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
error-stack = { workspace = true }
wherror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
trouper = { workspace = true }

ratatui = { workspace = true }
jinn-theme = { workspace = true }
jinn-selection-widget = { workspace = true }

[dev-dependencies]
jinn-testutil = { workspace = true }

# The work-time tests spawn the monitor actor — the cell's only writer — so a
# restore publish is observed landing in the cell the way production folds it.
jinn-work-time = { workspace = true }

uuid = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
jinn-kernel = { workspace = true }

# The migrator tests stand a DB up at a specific legacy schema version, which
# needs jinn-session-schema's test-only helpers.
jinn-session-schema = { workspace = true, features = ["testing"] }

# The build script creates the compile-time SQL validation DB (schema-crate
# pattern; mirrors jinn-kernel/build.rs).
[build-dependencies]
rusqlite = { workspace = true }
jinn-session-schema = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[lints]
workspace = true

