<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>jinn</title>
    <script>
      // The color mode, before the stylesheet loads. The store's theme is
      // the truth and overwrites this once connected; this hint only
      // stops a light-mode user seeing a dark flash on every load.
      (function () {
        try {
          var theme = window.localStorage.getItem("jinn.web2.theme");
          if (theme === "light" || theme === "dark" || theme === "system") {
            document.documentElement.dataset.theme = theme;
          }
        } catch (e) {}
      })();
    </script>
    <!-- The browser bar's colour, in the dark palette's background until the
         client reads the active palette back from the stylesheet. The install
         set: the manifest a phone installs from, and the two icons the shell
         alone names (the manifest names its own three). -->
    <meta name="theme-color" content="#25272e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/vendor/{{ icon_favicon_url }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="/vendor/{{ icon_apple_url }}" />
    <link rel="stylesheet" href="/vendor/{{ css_url }}" />
    <script type="module" src="/vendor/{{ js_url }}"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
