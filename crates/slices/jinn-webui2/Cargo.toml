[package]
name = "jinn-webui2"
version.workspace = true
edition.workspace = true
description = "The web UI slice: a message-driven mirror of the terminal UI over one WebSocket, bound per the [webui] config section — sessions, transcript, composer, pickers, title."

[dependencies]
# A leaf slice: its own contract crate
# (jinn-webui2-msg), the kernel for State, and the existing message
# crates whose commands it publishes and whose events it subscribes. No
# other slice's implementation crate except the store query the picker
# rows need.
jinn-webui2-msg = { workspace = true }
jinn-preferences-config = { workspace = true }
jinn-slices = { workspace = true }
jinn-config = { workspace = true }
jinn-kernel = { workspace = true }
jinn-core-types = { workspace = true }
jinn-app-state = { workspace = true }
jinn-session-state = { workspace = true }
# The rail's Sessions list is the terminal sidebar's own tree: one builder
# orders roots newest-first and children under their parent, so the two
# surfaces cannot disagree about where a child belongs. Kernel-free shared
# vocabulary.
jinn-session-list = { workspace = true }
jinn-session-store-msg = { workspace = true }
jinn-session-history-msg = { workspace = true }
jinn-context-assembly-msg = { workspace = true }
jinn-inference-msg = { workspace = true }
jinn-chat-input-msg = { workspace = true }
jinn-session-msg = { workspace = true }
jinn-provider-selection-msg = { workspace = true }
jinn-provider-config = { workspace = true }
jinn-tools-msg = { workspace = true }
# The skills modal's rows are filtered by the terminal picker's own matcher,
# so one filter cannot drift across the three surfaces. A contract crate.
jinn-skills-msg = { workspace = true }
# The MCP modal's rows come from the shared row vocabulary in the MCP msg
# crate (the same builder the TUI inspector consumes), and the toggle
# publishes that crate's `McpEnablementChanged`. Contract crate only: never
# the MCP implementation slice.
jinn-mcp-msg = { workspace = true }
# The persona modal's rows come from the shared row vocabulary in the
# persona msg crate. Contract crate only: never the persona implementation
# slice.
jinn-persona-msg = { workspace = true }
# The status bar's context figure is the terminal status bar's own, so the two
# surfaces cannot disagree. Contract crate only: never the status-bar
# implementation slice.
jinn-status-bar-msg = { workspace = true }
# The applets modal's rows are the saved-app catalog the applets store actor
# writes into its cell, and the open gesture publishes that crate's rescan
# and wake commands. Contract crate only: never the applets implementation
# slice.
jinn-applets-msg = { workspace = true }
# The composer's `#` popup re-filters when a session's prompt scan finishes:
# the outbound actor subscribes that crate's `PromptTemplatesLoaded`.
# Contract crate only: never the session-init implementation slice.
jinn-session-init-msg = { workspace = true }
# `TextRun` — the matched/plain split the shared skill filter returns.
jinn-selection-widget = { workspace = true }
# The composer's image attachments ingest through the `read_image` tool's
# converter, shared as a library crate (sniff, transcode to PNG, cap).
jinn-llm-support = { workspace = true }
# The new-session form lists the configured lifecycles and counts the
# arguments each setup declares. Contract crate only.
jinn-session-lifecycle-msg = { workspace = true }
# An image URL in the message text is fetched by the server; base64 decodes
# the composer's uploads — the same pinned reqwest shape the provider
# backends use.
reqwest = { workspace = true }
base64 = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
# The stored-session picker ranks titles with the terminal picker's own matcher.
fuzzy-matcher = "0.3"
# `MarkedPathAccess` names a session project by its directory, as the TUI picker does.
marked-path = { workspace = true }
# Session rows carry each session's last settle-to-Idle time as the core
# `Timestamp` — the phase event's own type.
jiff = { workspace = true }
trouper = { workspace = true }
tokio = { workspace = true }
# The socket's read and write halves run as two tasks over one connection.
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

[build-dependencies]
# The build script builds the web UI client itself — `npm ci` when stale,
# `tsc`, `vite build` — and gzips the output into OUT_DIR for embedding.
# Node and npm are therefore build prerequisites of this crate.
flate2 = "1"
# Each built asset's sha256 is the pin the page shell names it by.
sha2 = "0.10"

[dev-dependencies]
# The streaming-batch tests pause the clock so the window is asserted
# without sleeping.
tokio = { workspace = true, features = ["test-util"] }
rstest = { workspace = true }
jinn-testutil = { workspace = true }
# Tests resolve the provider cell from the same catalog boot registers it in.
jinn-cell-catalog = { workspace = true }
# The tree tests build picker entries, which carry a theme the rows never
# read on this surface.
jinn-theme = { workspace = true }
# The queue-depth tests put real items on a session's turn queue, the way
# the session actor does on a busy-phase enqueue; the item type is this
# crate's and is not re-exported by anything the web UI depends on in production.
jinn-turn-dispatch-msg = { workspace = true }
# The test store implements the store trait's async methods.
async-trait = { workspace = true }
# The route tests dispatch through the real router via oneshot.
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
