# The /web2 slice's client assets.
#
# Unlike the original web UI's bundle (vendored input nothing regenerates),
# these files are build OUTPUT of webui/client2, and this manifest is
# written by `just webui2-build` — do not hand-edit the hashes.
#
# Two gates, both enforced by build.rs on every compile:
#
#   source_sha256  the hash of the client sources the bundle was built from.
#                  Sources newer than this pin fail the build: a stale
#                  bundle is a compile error, never a runtime surprise.
#   assets[].sha256  each committed file's sha256, so the bytes embedded in
#                  the binary are exactly the ones verified.
#
# To change the client: edit webui/client2, then run `just webui2-build`.

source_sha256 = "b3c7c4abca04d4dc30f31af858935299ff836da737eb95bacc992fb89729b08a"

[[assets]]
served = "client2.js"
sha256 = "433a94dbc77d635b703f69b80fc98067058b45bda84364ce24a059fa4b1b5b1b"

[[assets]]
served = "client2.css"
sha256 = "cb048e20d6461f233b4bd9b375dd74dba50682d64871e4fa9bdc15b157457223"
