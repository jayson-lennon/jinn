[package]
name = "jinn-model-market-msg"
version.workspace = true
edition.workspace = true
description = "Model-market crossing contracts: the data and UI cell payloads, slot keys, scope id, and the fetch/refresh commands and events."

[dependencies]
jinn-core-types = { workspace = true }
jinn-slices = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
trouper = { workspace = true }
# The market filter is SkimMatcherV2 — the terminal picker's own matcher — so
# one filter cannot drift between the surfaces.
fuzzy-matcher = { workspace = true }
# The name's matched/plain runs are cut on grapheme boundaries.
unicode-segmentation = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
