[package]
name = "jinn-session-init"
version = "0.116.1"
edition.workspace = true
publish.workspace = true

[dependencies]
# Core types: SessionId keys every command and event.
jinn-core-types = { workspace = true }
# Plain-form path canonicalization (`canonicalize_display`) for the bounded
# project walk — cwd and home must compare in the same non-verbatim form.
jinn-common = { workspace = true }
jinn-context = { workspace = true }
jinn-skills-msg = { workspace = true }
jinn-skills = { workspace = true }
jinn-workflows-msg = { workspace = true }
jinn-workflows = { workspace = true }
# Slice host verbs (`forward`/`reverse` staging, AppSliceHost) and the
# crossing_schema! macro.
jinn-slices = { workspace = true }
# The trouper runtime: ServiceActors, topics, schemas, partition sets.
trouper = { workspace = true }
# The kernel seam: shared `State`, the trouper bridge relay spawn functions,
# `scan_cwd_for_session`'s gate, and
# kernel event types this slice translates and returns via relays.
jinn-kernel = { workspace = true }
jinn-session-msg = { workspace = true }
jinn-session-store-msg = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }

jinn-session-init-msg = { workspace = true }
jinn-session-lifecycle-msg = { workspace = true }

[dev-dependencies]
jinn-testutil = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
