[package]
name = "jinn-discord"
edition.workspace = true
version.workspace = true

[dependencies]
marked-path = { workspace = true }
dirs = { workspace = true }
async-trait = { workspace = true }
daow = { workspace = true }
jinn-config = { workspace = true }
jinn-chat-input-msg = { workspace = true }
jinn-context = { workspace = true }
jinn-core-types = { workspace = true }
jinn-discord-msg = { workspace = true }
# The bridge subscriber folds trouper topic events (session lifecycle
# family) into the gateway channels; the session slices have not
# graduated to crates yet, so shared `State` still lives in jinn-kernel.
# This edge survives the cut (slice → domain is the legal direction).
jinn-kernel = { workspace = true }
jinn-preferences-config = { workspace = true }
jinn-boot-msg = { workspace = true }
jinn-session-msg = { workspace = true }
jinn-session-lifecycle-msg = { workspace = true }
jinn-session-state = { workspace = true }
jinn-session-store-msg = { workspace = true }
jinn-slices = { workspace = true }
kanal = { workspace = true }
parking_lot = { workspace = true }
rstest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
trouper = { workspace = true }
tracing = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }
derive_more = { workspace = true }
poise = { workspace = true }

[build-dependencies]
rusqlite = { workspace = true }
jinn-session-schema = { workspace = true }

[dev-dependencies]
# Activation resolves the connection cell from the shared catalog, so the
# tests seed their registry through it rather than through the slice.
jinn-cell-catalog = { workspace = true }
jinn-testutil = { workspace = true }
tempfile = { workspace = true }
jinn-session-store = { workspace = true }
