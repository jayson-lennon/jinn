[package]
name = "jinn-discord"
version = "0.116.1"
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait = { workspace = true }
daow = { workspace = true }
jinn-core-types = { workspace = true }
jinn-discord-msg = { workspace = true }
# The bridge subscriber folds trouper topic events (session lifecycle
# family) into the gateway channels; the session slices have not
# graduated to crates yet, so State and the session capability still
# live in jinn-domain. This edge survives the cut (slice → domain is
# the legal direction).
jinn-domain = { workspace = true, features = ["test-harness"] }
jinn-session-msg = { workspace = true }
jinn-slices = { workspace = true }
kanal = { workspace = true }
parking_lot = { workspace = true }
rstest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
trouper = { workspace = true }
tracing = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }
derive_more = { workspace = true }
poise = { workspace = true }

[build-dependencies]
rusqlite = { workspace = true }
jinn-session-schema = { workspace = true }

[dev-dependencies]
jinn-testutil = { workspace = true }
tempfile = { workspace = true }
kameo = { workspace = true }
kameo_actors = { workspace = true }
