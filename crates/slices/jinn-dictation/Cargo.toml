[package]
name = "jinn-dictation"
version.workspace = true
edition.workspace = true
description = "The dictation slice: one actor owning the backend lifecycle (fetch, load, arm, disarm) plus the alt-i toggle row and the seam volume meter."

[dependencies]
# Platform gate: the real Parakeet backend compiles on linux and
# windows targets; every other platform links the null path through the
# single cfg module (platform.rs). The target-scoped tables below are
# the whole manifest-side platform split.
jinn-dictation-backend = { workspace = true }
jinn-dictation-msg = { workspace = true }
jinn-chat-input-msg = { workspace = true }
jinn-preferences-config = { workspace = true }
jinn-kernel = { workspace = true }
jinn-slices = { workspace = true }
jinn-config = { workspace = true }
jinn-status-bar-msg = { workspace = true }
error-stack = { workspace = true }
wherror = { workspace = true }
trouper = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
ratatui = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
jinn-dictation-backend-parakeet = { path = "../../backends/jinn-dictation-backend-parakeet" }
# The denoise stage (48 kHz frames, before the resample): pure Rust.
nnnoiseless = "0.5"
# The resample stage (device rate -> 16 kHz): sherpa-onnx's linear
# resampler, the same native dependency the backend already carries.
# On Windows the `static` feature's build script downloads sherpa's
# prebuilt MSVC libs (sherpa core + onnxruntime, /MT) — no onnxruntime
# install, no CMake.
sherpa-onnx = { version = "2.0", default-features = false, features = ["static"] }

# The capture arm: device enumeration and stream open. One cpal table
# per OS so each names only the features its backend needs: Linux
# rides PipeWire; Windows rides cpal's default WASAPI backend (no
# feature list). The null-platform path never touches cpal (the arm
# compiles out with the gated module).
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pipewire"] }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "0.18" }

[dev-dependencies]
rstest = { workspace = true }
jinn-testutil = { workspace = true }
jinn-app-state = { workspace = true }
# The meter geometry test pins the derived rect to composition's
# `AppLayout` — the only jinn-tui edge, test-only.
jinn-tui = { workspace = true }

[lints]
workspace = true
