[package]
name = "jinn-webui2-msg"
version.workspace = true
edition.workspace = true
description = "The wire contract for the second web UI: the two tagged message enums the browser and the server exchange over one WebSocket."

[dependencies]
# A pure contract crate: data and pure functions only. No actor, no
# behavior trait, and never another slice's implementation crate. The
# entry and session vocabulary rides in from the core types crate, so a
# payload is the same shape the bus already serializes; the phase rides in
# from the shared vocabulary crate.
jinn-core-types = { workspace = true }
jinn-session-store-msg = { workspace = true }
jinn-slices = { workspace = true }
# The stored-session picker's row carries the store's own timestamp, which
# the browser formats in its zone.
jiff = { workspace = true }
serde = { workspace = true }
# The wire projection (`wire_entry`) is built as a JSON tree: the entry's
# persisted serde form with two heavy fields removed.
serde_json = { workspace = true }

[dev-dependencies]
# The round-trip and all-kinds tests build real entries with the core
# constructors.
rstest = { workspace = true }

[lints]
workspace = true
