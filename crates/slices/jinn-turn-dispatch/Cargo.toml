[package]
name = "jinn-turn-dispatch"
version.workspace = true
edition.workspace = true
description = "The turn-dispatch slice: the queue actor that owns turn draining and dispatch."

[dependencies]
jinn-turn-dispatch-msg = { workspace = true }
jinn-inference-msg = { workspace = true }
# The trouper runtime: ServiceActors, topics, schemas.
trouper = { workspace = true }
# Kernel dep: the queue actor uses shared `State`, consumes session vocabulary
# (QueueItem/ChatEntry, phase machine, enqueue protocols), and asks the
# context-assembly service through `Services`.
jinn-core-types = { workspace = true }
jinn-session-msg = { workspace = true }
jinn-session-history-msg = { workspace = true }
jinn-session-store-msg = { workspace = true }
jinn-token-count-msg = { workspace = true }
jinn-provider-selection = { workspace = true }
jinn-provider-selection-msg = { workspace = true }
jinn-kernel = { workspace = true }
jinn-chat-input-msg = { workspace = true }
jinn-context-assembly = { workspace = true }
jinn-slices = { workspace = true }
serde_json = { workspace = true }
error-stack = { workspace = true }
tracing = { workspace = true }
jiff = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
jinn-kernel = { workspace = true }
# Test-only: the real phase actor, spawned in tests to answer the queue
# actor's admission asks before any publish (production composition spawns
# it; a production edge here would be wrong).
jinn-session-turn = { workspace = true }
# Test-only: the attachment-gate test builds a provider `Attachment`.
jinn-provider = { workspace = true }

[lints]
workspace = true
