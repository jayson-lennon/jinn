[package]
name = "jinn-inference"
version.workspace = true
edition.workspace = true
description = "The inference slice: the actor that drives LLM provider streams."

[dependencies]
wherror = { workspace = true }
parking_lot = { workspace = true }
throbber-widgets-tui = { workspace = true }
ratatui = { workspace = true }
jinn-session-msg = { workspace = true }
jinn-inference-msg = { workspace = true }
# The trouper runtime: ServiceActors, topics, schemas.
trouper = { workspace = true }
# Kernel dep (token-count precedent): the inference actor publishes on the
# fabric and resolves LLM factories through Services (llm_service,
# provider_registry, api_keys, request_dump, user_preferences_storage) —
# granted at slice activation. The converter fn for retry config lives
# kernel-side (jinn-preferences-config must not dep jinn-provider).
jinn-core-types = { workspace = true }
jinn-kernel = { workspace = true }
jinn-slices = { workspace = true }
jinn-session-history-msg = { workspace = true }
jinn-provider = { workspace = true }
jinn-provider-config = { workspace = true }
jinn-tools-msg = { workspace = true }
jinn-preferences-config = { workspace = true }
serde_json = { workspace = true }
error-stack = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
jiff = { workspace = true }
tokio = { workspace = true }
reasoning-parser = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
jinn-testutil = { workspace = true }
# The cwd tests stamp typed paths into a live session state; the typed
# session-cwd field carries marked-path, so the tests do too.
marked-path = { workspace = true }
# Tests build a real compiled rule set to drive the stream loop with. The
# production path resolves the matcher from the cell and never names this
# crate — only the tests that need a concrete implementation do.
jinn-stream-rules = { workspace = true }
# The interception tests mint the stream-rules cell so the spawned actor
# resolves a rule set the way production does. Same reasoning: test-only.
jinn-cell-catalog = { workspace = true }

serde_json = { workspace = true }
jinn-kernel = { workspace = true }
# The project-narrowing tests stamp a fake session store with a project
# association, so `resolve_rule_session` sees a stamped session.
jinn-session-state = { workspace = true }
# The same fake store's `SessionStore` impl names the search-message types.
jinn-session-store-msg = { workspace = true }
# The project-narrowing tests root fixture cwds in a temp directory rather
# than spelling absolute machine paths.
# The reasoning-loop pipeline integration test composes the pipeline's
# actors on one harness bus. Every edge is acyclic: these crates consume
# jinn-inference's messages; none depends on the jinn-inference impl.
jinn-watchdog = { workspace = true }
jinn-session-turn = { workspace = true }
jinn-turn-dispatch = { workspace = true }
jinn-context-assembly = { workspace = true }
jinn-llm-support = { workspace = true }
jinn-chat-input-msg = { workspace = true }
jinn-turn-dispatch-msg = { workspace = true }
jinn-token-count-msg = { workspace = true }

rstest = { workspace = true }

[lints]
workspace = true

