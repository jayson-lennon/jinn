[package]
name = "jinn-boot"
version.workspace = true
edition.workspace = true
description = "The boot slice: the startup trio (system-ready, env-init, provider-init) spawned by composition."

[dependencies]
jinn-config = { workspace = true }
jinn-boot-msg = { workspace = true }
# The trouper runtime: ServiceActors, topics, schemas.
trouper = { workspace = true }
# Kernel dep (turn-dispatch/session-store precedent): the boot actors
# read/write AppState through the shared `State` API, publish
# provider contracts, and reuse the kernel session vocabulary
# (no_api_keys_msg).
jinn-kernel = { workspace = true }
jinn-core-types = { workspace = true }
jinn-mcp-msg = { workspace = true }
# The provider cell (minted by the provider-selection slice's install and
# threaded in here) + the provider contracts (ProviderSwitch,
# ModelCacheLoaded) that migrate with that slice.
jinn-provider-selection-msg = { workspace = true }
jinn-provider-config = { workspace = true }
jinn-slices = { workspace = true }
jinn-session-history-msg = { workspace = true }
jinn-preferences-config = { workspace = true }
kanal = { workspace = true }
error-stack = { workspace = true }
wherror = { workspace = true }
jiff = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
jinn-testutil = { workspace = true }
# The sample factory backs the P11 pre-reload-held-factory test.
jinn-provider = { workspace = true }

rstest = { workspace = true }
toml = { workspace = true }
jinn-kernel = { workspace = true }

[lints]
workspace = true

