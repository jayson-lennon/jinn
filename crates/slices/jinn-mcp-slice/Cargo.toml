[package]
name = "jinn-mcp-slice"
version.workspace = true
edition.workspace = true

[dependencies]
marked-path = { workspace = true }
jinn-mcp-msg = { workspace = true }
# The live-reload trigger: a jinn.toml change reconciles every session.
jinn-boot-msg = { workspace = true }
# Kernel dep: the coordinator consumes shared application state and session
# lifecycle events through the asynchronous actor path.
jinn-kernel = { workspace = true }
jinn-llm-support = { workspace = true }
jinn-picker = { workspace = true }
jinn-selection-widget = { workspace = true }
jinn-theme = { workspace = true }
ratatui = { workspace = true }
unicode-segmentation = { workspace = true }
jinn-preferences-config = { workspace = true }
jinn-tools-msg = { workspace = true }
jinn-mcp = { workspace = true }
jinn-slices = { workspace = true }
jinn-session-msg = { workspace = true }
jinn-session-lifecycle-msg = { workspace = true }
jinn-session-state = { workspace = true }
jinn-session-store-msg = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
trouper = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
libc = "0.2"
jinn-core-types = { workspace = true }
error-stack = { workspace = true }
wherror = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# `activate_picker` resolves the inspector's cell the catalog owns, so the
# tests seed their registry through the same list production boot uses.
jinn-cell-catalog = { workspace = true }
jinn-testutil = { workspace = true }

jinn-config = { workspace = true }
jinn-tools = { workspace = true }
rstest = { workspace = true }
ctor = "0.8"
rustls = { workspace = true }

