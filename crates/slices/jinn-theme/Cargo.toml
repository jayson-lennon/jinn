[package]
name = "jinn-theme-slice"
version.workspace = true
edition.workspace = true
description = "The theme slice: loads theme files into the theme-entries cell at activation."

[dependencies]
marked-path = { workspace = true }
jinn-chat-log-view-msg = { workspace = true }
jinn-theme-msg = { workspace = true }
jinn-slices = { workspace = true }
jinn-theme = { workspace = true }
jinn-picker = { workspace = true }
jinn-selection-widget = { workspace = true }
jinn-app-state = { workspace = true }
jinn-preferences-config = { workspace = true }
ratatui = { workspace = true }
error-stack = { workspace = true }
wherror = { workspace = true }
tracing = { workspace = true }
trouper = { workspace = true }
jinn-boot-msg = { workspace = true }
jinn-kernel = { workspace = true }

[dev-dependencies]
jinn-testutil = { workspace = true }
# Activation resolves the theme cells from the shared catalog, so the
# tests seed their registry through it rather than through the slice.
jinn-cell-catalog = { workspace = true }
# The picker tests wire the slice the way composition does, which needs the
# kernel's Services. Production code reaches the state through jinn-app-state
# and never touches the kernel, which is what keeps this slice kernel-free.
jinn-chat-log-view = { workspace = true }
jinn-core-types = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
