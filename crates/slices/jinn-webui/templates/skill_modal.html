<div id="{{ modal_id }}" class="skill-modal"
     data-attr:hidden="$skillsOpen ? null : true" hidden
     data-on:click="evt.target === evt.currentTarget && ($skillsOpen = false)"><div class="skill-modal-inner"
     data-on:keydown__escape__document="$skillsOpen = false"><div class="skill-modal-head">Skills</div><div id="{{ rows_id }}"
      data-effect="($skillsTick + ' ' + $skillsOpen).trim() && $skillsOpen && @get('{{ picker_route }}' + $viewedSession, {selector: '#{{ modal_host_id }}', openWhenHidden: true})"

    >{% for row in rows %}{{ row|safe }}{% endfor %}</div></div></div>
