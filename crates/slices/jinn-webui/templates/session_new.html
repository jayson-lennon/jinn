{% if !projects.is_empty() %}<div id="{{ modal_id }}" class="session-new-modal"
     data-attr:hidden="$sessionNewOpen ? null : true"
     data-on:click="evt.target === evt.currentTarget && ($sessionNewOpen = false)"><div class="session-new-modal-inner"
     data-on:keydown__escape__document="$sessionNewOpen = false"><h2 class="session-new-title">New session</h2><div class="session-new-field"><label for="{{ project_id }}">Project</label><select id="{{ project_id }}" autocomplete="off"
        data-bind:sessionnewproject>{% for option in projects %}<option value="{{ option.value }}">{{ option.label }}</option>{% endfor %}</select></div><div class="session-new-field"><label for="{{ lifecycle_id }}">Lifecycle</label><select id="{{ lifecycle_id }}" autocomplete="off"
        data-bind:sessionnewlifecycle
        data-on:change="@get('{{ session_new_route }}?lifecycle=' + encodeURIComponent($sessionnewlifecycle || ''), {selector: '#{{ session_new_host_id }}', openWhenHidden: true})">{% for option in lifecycles %}{% if option.value == selected_lifecycle %}<option value="{{ option.value }}" selected{% if let Some(count) = option.param_count %} {{ param_count_attr }}="{{ count }}"{% endif %}>{{ option.label }}</option>{% else %}<option value="{{ option.value }}"{% if let Some(count) = option.param_count %} {{ param_count_attr }}="{{ count }}"{% endif %}>{{ option.label }}</option>{% endif %}{% endfor %}</select></div>{% if show_args %}<div class="session-new-field"><label for="{{ args_id }}">Setup arguments</label><input id="{{ args_id }}" type="text" autocomplete="off" placeholder="Please enter: {{ arg_tokens }}"
          data-bind:sessionnewargs><p class="session-new-hint">fill {{ arg_tokens }} — space-separated, quoting spaces</p></div>{% endif %}<div class="session-new-actions"><button id="{{ submit_id }}" type="button" class="session-new-submit"
        data-on:click="$sessionnewproject.length > 0 && @post('{{ create_path }}', {contentType: 'json', payload: {project: $sessionnewproject, lifecycle: $sessionnewlifecycle, args: $sessionnewargs || ''}, selector: '#{{ page_root_id }}', openWhenHidden: true})">Create session</button></div></div></div>{% else %}<div id="{{ modal_id }}" class="session-new-modal"
     data-attr:hidden="$sessionNewOpen ? null : true"
     data-on:click="evt.target === evt.currentTarget && ($sessionNewOpen = false)"><div class="session-new-modal-inner"><div id="{{ empty_id }}" class="session-new-empty"><h2 class="session-new-title">New session</h2><p>No projects are configured. Add a <code>[[project.entry]]</code> with a <code>path</code> to your <code>jinn.toml</code>, then reload this page.</p></div></div></div>{% endif %}
