{%- if busy -%}
<div id="{{ spinner_id }}" class="busy-spinner" title="Streaming…"></div>
{%- endif -%}
<div id="{{ composer_id }}"
     data-on:jinnaddimages__document="$images = [...$images, ...evt.detail.images]"
     data-effect="$images.length && window.jinnRenderChips && window.jinnRenderChips($images)">
  {#- Pending attachments: paste.js keeps this strip in step with the
      images signal and splices on each chip's ✕. The strip exists
      declaratively (no iteration — the bundle has no data-for). -#}
  <div id="{{ chips_id }}" class="chips" data-show="$images.length > 0"></div>
  <textarea id="{{ input_id }}" placeholder="Message… (Enter to send, Shift+Enter for newline)"
            data-bind:text
            data-on:keydown="evt.key === 'Enter' && !evt.shiftKey && (evt.preventDefault() || true) && ($text.trim().length > 0 || $images.length > 0) && @post('{{ send_path }}', {contentType: 'json', payload: {sessionId: $viewedSession, text: $text, images: $images}})"></textarea>
  <label class="attach" id="{{ attach_button_id }}" title="Attach an image">
    <input type="file" id="{{ file_input_id }}" accept="image/*" multiple
           data-on:change="window.jinnAttachFiles(el.files) && (el.value = '')">
    +
  </label>
  {%- if busy -%}
  <button class="cancel" {{ action_attr }}="{{ cancel_action }}" data-on:click="@post('{{ cancel_path }}', {contentType: 'json', payload: {sessionId: $viewedSession}})">{{ cancel_label }}</button>
  {%- else -%}
  <button {{ action_attr }}="{{ send_action }}" data-on:click="($text.trim().length > 0 || $images.length > 0) && @post('{{ send_path }}', {contentType: 'json', payload: {sessionId: $viewedSession, text: $text, images: $images}})">{{ send_label }}</button>
  {%- endif %}
</div>
