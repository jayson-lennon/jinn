{%- if busy -%}
<div id="{{ spinner_id }}" class="busy-spinner" title="Streaming…"></div>
{%- endif -%}
<div id="{{ composer_id }}">
  <textarea id="{{ input_id }}" placeholder="Message… (Enter to send, Shift+Enter for newline)"></textarea>
  {%- if busy -%}
  <button class="cancel" {{ action_attr }}="{{ cancel_action }}">{{ cancel_label }}</button>
  {%- else -%}
  <button {{ action_attr }}="{{ send_action }}">{{ send_label }}</button>
  {%- endif %}
</div>
