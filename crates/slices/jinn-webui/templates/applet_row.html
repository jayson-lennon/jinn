{% if is_link %}<a class="applet-row" href="{{ href }}" target="_blank" rel="noopener" {{ applet_attr }}="{{ entry.id }}">{% for seg in title_segments %}{% if seg.matched %}<mark>{{ seg.text }}</mark>{% else %}{{ seg.text }}{% endif %}{% endfor %}</a>{% else %}<span class="applet-row applet-row-disabled"{% if !offline_hint.is_empty() %} title="{{ offline_hint }}"{% endif %} {{ applet_attr }}="{{ entry.id }}">{% for seg in title_segments %}{% if seg.matched %}<mark>{{ seg.text }}</mark>{% else %}{{ seg.text }}{% endif %}{% endfor %}</span>{% endif %}
