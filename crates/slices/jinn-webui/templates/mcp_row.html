<div {{ action_attr }}="{{ toggle_action }}" {{ server_attr }}="{{ row.name }}" data-on:click="@post('{{ toggle_path }}', {contentType: 'json', payload: {sessionId: $viewedSession, server: '{{ row.name|js_str }}', filter: ${{ filter_signal }}}})" class="mcp-row{% if row.enabled %} mcp-row-enabled{% endif %}"><span class="mcp-row-marker">{% if row.enabled %}●{% else %}○{% endif %}</span><span class="mcp-row-name">{% for seg in name_segments %}{% if seg.matched %}<mark>{{ seg.text }}</mark>{% else %}{{ seg.text }}{% endif %}{% endfor %}</span><span class="mcp-row-summary">{% for seg in description_segments %}{% if seg.matched %}<mark>{{ seg.text }}</mark>{% else %}{{ seg.text }}{% endif %}{% endfor %}</span><span class="mcp-row-status mcp-status-{{ status_class }}">{{ status_label }}</span></div>
