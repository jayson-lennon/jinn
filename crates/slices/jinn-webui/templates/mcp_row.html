<div {{ action_attr }}="{{ toggle_action }}" {{ server_attr }}="{{ row.name }}" data-on:click="@post('{{ toggle_path }}', {contentType: 'json', payload: {sessionId: $viewedSession, server: '{{ row.name }}'}})" class="mcp-row{% if row.enabled %} mcp-row-enabled{% endif %}"><span class="mcp-row-marker">{% if row.enabled %}●{% else %}○{% endif %}</span><span class="mcp-row-name">{{ row.name }}</span><span class="mcp-row-summary">{{ row.description }}</span><span class="mcp-row-status mcp-status-{{ status_class }}">{{ status_label }}</span></div>
