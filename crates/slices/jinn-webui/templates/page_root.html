<div id="{{ page_root_id }}" {{ page_session_attr }}="{{ session_id }}"
     data-signals="{ drawerOpen: false, menuOpen: false, modalOpen: false, sessionNewOpen: false, personaModalOpen: false, mcpOpen: false, toolsOpen: false, toolsRevert: null, toolsTick: '', skillsOpen: false, mcpTick: '', skillsTick: '', personafilter: '', titleEditing: false, titleCommitting: false, modelsRefreshing: false, modelfilter: '', providerId: '', sessionsTick: 0, sessionsAttention: {{ sessions_attention }}, chatTick: 0, modelsTick: '', title: '{{ title }}', viewedSession: '{{ session_id }}', sessionsfilter: '', text: '' }"
     data-class:drawer-open="$drawerOpen"
     data-on:keydown__document="evt.key === 'Escape' && ($menuOpen ? $menuOpen = false : ($drawerOpen ? $drawerOpen = false : undefined))">
  <nav id="sidebar">
    <h2>Sessions</h2>
    <input id="{{ sessions_filter_input_id }}" type="text" placeholder="filter sessions…"
           autocomplete="off" spellcheck="false" data-bind:sessionsfilter>
    <div id="{{ sessions_id }}"
         data-effect="($sessionsTick + ' ' + $sessionsfilter).trim() && @get('{{ sessions_route }}' + ($sessionsfilter ? '?q=' + encodeURIComponent($sessionsfilter) : ''), {selector: '#{{ sessions_id }}', openWhenHidden: true})">{{ sessions_html|safe }}</div>
  </nav>
  <main id="main">
    <div id="titlebar">
      <span id="{{ menu_id }}">{{ menu_html|safe }}</span>
      <span class="t" {% if !session_title_id.is_empty() %}id="{{ session_title_id }}" data-on:click="$titleEditing = true"{% endif %}>{% if !session_title_id.is_empty() %}<span data-show="!$titleEditing" data-text="$title">{{ title }}</span><input data-show="$titleEditing" data-bind:title data-model-modifiers.trim
             data-on:keydown="evt.key === 'Enter' && ($titleCommitting || ($title.trim().length > 0 && ($titleCommitting = true) !== undefined && @post('{{ session_page_path }}' + $viewedSession + '/rename', {contentType: 'json', payload: {title: $title}})) !== undefined) || evt.key === 'Escape' && ($title = '{{ title }}', $titleEditing = false) !== undefined && evt.preventDefault()"
             data-on:blur="$titleCommitting || ($titleEditing = false, $title = '{{ title }}') !== undefined">{% else %}{{ title }}{% endif %}</span>
      <span id="{{ picker_host_id }}">{{ button_html|safe }}</span>
    </div>
    <span id="{{ modal_host_id }}"></span>
    <span id="{{ session_new_host_id }}"></span>
    <span id="{{ persona_modal_host_id }}"></span>
    <span id="{{ mcp_modal_host_id }}"></span>
    <span id="{{ tools_modal_host_id }}"></span>
    <span id="{{ skills_modal_host_id }}"></span>
    <div id="{{ transcript_wrap_id }}" data-ref:transcriptwrap
         data-init="$transcriptwrap && $transcriptwrap.scrollTo({ top: Number.MAX_SAFE_INTEGER })">
      <div id="{{ transcript_id }}" {{ cursor_attr }}="{{ cursor }}">{{ transcript_html|safe }}</div>
    </div>
    <div id="{{ controls_id }}">{{ controls_html|safe }}</div>
  </main>
  <div id="{{ drawer_scrim_id }}" data-attr:hidden="$drawerOpen ? null : true" hidden
       data-on:click="$drawerOpen = false"></div>
  <div id="{{ menu_scrim_id }}" data-attr:hidden="$menuOpen ? null : true" hidden
       data-on:click="$menuOpen = false"></div>
  {% if stream_url != "" %}
  <span data-init="@get('{{ stream_url }}', {openWhenHidden: true, retryMaxCount: Infinity, requestCancellation: 'cleanup'})"></span>
  {% endif %}
</div>
