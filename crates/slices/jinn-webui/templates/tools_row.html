<div {{ action_attr }}="{{ toggle_action }}" {{ tool_attr }}="{{ row.name }}" data-on:click="@post('{{ toggle_path }}', {contentType: 'json', payload: {sessionId: $viewedSession, tool: '{{ row.name }}'}})" class="tools-row{% if !row.enabled %} tools-row-off{% endif %}"><span class="tools-row-marker">{% if row.enabled %}✓{% else %}✗{% endif %}</span><span class="tools-row-name">{{ row.name }}</span><span class="tools-row-summary">{{ row.description }}</span></div>
