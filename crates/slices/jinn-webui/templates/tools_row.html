<div {{ action_attr }}="{{ toggle_action }}" {{ tool_attr }}="{{ row.name }}" data-on:click="@post('{{ toggle_path }}', {contentType: 'json', payload: {sessionId: $viewedSession, tool: '{{ row.name|js_str }}', filter: ${{ filter_signal }}}})" class="tools-row{% if !row.enabled %} tools-row-off{% endif %}"><span class="tools-row-marker">{% if row.enabled %}✓{% else %}✗{% endif %}</span><span class="tools-row-name">{% for seg in name_segments %}{% if seg.matched %}<mark>{{ seg.text }}</mark>{% else %}{{ seg.text }}{% endif %}{% endfor %}</span><span class="tools-row-summary">{% for seg in description_segments %}{% if seg.matched %}<mark>{{ seg.text }}</mark>{% else %}{{ seg.text }}{% endif %}{% endfor %}</span></div>
