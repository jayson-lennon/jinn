<html lang="en">
<head>

  <meta name="theme-color" content="{{ theme_color }}">
  <link rel="manifest" href="/vendor/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/vendor/icon-favicon-32.png">

  {%- include "page_root.html" -%}
</body>
</html>
