<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} — jinn</title>
  <script type="module" src="{{ vendor_prefix }}{{ app_js_versioned }}"></script>
  <style>{{ style|safe }}</style>
</head>
<body>
  <div id="{{ page_root_id }}" {{ page_session_attr }}="{{ session_id }}">
  <nav id="sidebar">
    <h2>Sessions</h2>
    <input id="{{ sessions_filter_input_id }}" type="text" placeholder="filter sessions…"
           autocomplete="off" spellcheck="false">
    <div id="{{ sessions_id }}">{{ sessions_html|safe }}</div>
  </nav>
  <main id="main">
    <div id="titlebar">
      <span class="t" {% if !session_title_id.is_empty() %}id="{{ session_title_id }}"{% endif %}>{{ title }}</span>
      {{ status_html|safe }}
    </div>
    <span id="{{ modal_host_id }}"></span>
    <div id="{{ transcript_wrap_id }}">
      <div id="{{ transcript_id }}" {{ cursor_attr }}="{{ cursor }}">{{ transcript_html|safe }}</div>
    </div>
    <div id="{{ controls_id }}">{{ controls_html|safe }}</div>
  </main>
  </div>
</body>
</html>
