<article class="entry {{ entry.class }}" id="entry-{{ index }}">
  <div class="who">{{ entry.class }}</div>
  {%- if entry.is_disclosure -%}
  <details class="disclosure">
    <summary>{% if let Some(summary) = entry.summary %}{{ summary }}{% endif %}</summary>
    <div class="body">{% if let Some(status) = entry.tool_status %}<span class="badge {{ status }}">{{ status }}</span>{% endif %}
{{ entry.body_html|safe }}</div>
  </details>
  {%- else -%}
  <div class="body">{{ entry.body_html|safe }}</div>
  {%- endif %}
</article>
