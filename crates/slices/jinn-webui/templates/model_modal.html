<div id="{{ modal_id }}" class="model-picker-modal" data-attr:hidden="$modalOpen ? null : true" hidden><div class="model-picker-modal-inner"
     data-on:click__outside="$modalOpen = false"
     data-on:key__down__escape__document="$modalOpen = false"><div class="model-picker-modal-head"><input id="{{ filter_id }}" type="text" value="{{ filter }}" autocomplete="off" placeholder="filter models…"
           data-bind:modelFilter><button id="{{ refresh_id }}"
        data-attr:disabled="$modelsRefreshing ? '' : null"
        data-attr:aria-busy="$modelsRefreshing ? 'true' : null"
        data-on:click="$modelsRefreshing = true; @post('{{ refresh_path }}', {contentType: 'json'})">Refresh models</button></div><div id="{{ rows_id }}"
      data-effect="$modelsTick ? ($modelsRefreshing = false, @get('{{ picker_route }}' + $viewedSession + '?filter=' + encodeURIComponent($modelFilter || ''), {selector: '#{{ modal_host_id }}', openWhenHidden: true})) : null"
    >{% for row in rows %}{{ row|safe }}{% endfor %}</div></div></div>
