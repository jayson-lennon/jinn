<div id="{{ modal_id }}" class="model-picker-modal" data-attr:hidden="$modalOpen ? null : true" hidden><div class="model-picker-modal-inner"
     data-effect="$modelsTick && ($modelsRefreshing = false)"
     data-on:click__outside="$modalOpen = false"
     data-on:keydown__escape__document="$modalOpen = false"><div class="model-picker-modal-head"><input id="{{ filter_id }}" type="text" value="{{ filter }}" autocomplete="off" placeholder="filter models…"
           data-bind:modelfilter><button id="{{ refresh_id }}"
        data-attr:disabled="$modelsRefreshing ? '' : null"
        data-attr:aria-busy="$modelsRefreshing ? 'true' : null"
        data-on:click="$modelsRefreshing = true; @post('{{ refresh_path }}', {contentType: 'json', payload: {sessionId: $viewedSession}})">Refresh models</button></div><div id="{{ rows_id }}"
      data-effect="($modelsTick + ' ' + $modelfilter).trim() && $modalOpen && @get('{{ picker_route }}' + $viewedSession + '?filter=' + encodeURIComponent($modelfilter || ''), {selector: '#{{ modal_host_id }}', openWhenHidden: true})"

    >{% for row in rows %}{{ row|safe }}{% endfor %}</div></div></div>
