<div{% if entry.is_active %} {{ active_attr }}="true"{% endif %} {{ action_attr }}="{{ persona_action }}" {{ persona_attr }}="{{ entry.name }}" data-on:click="$personaModalOpen = false; @post('{{ persona_path }}', {contentType: 'json', payload: {sessionId: $viewedSession, persona: '{{ entry.name|js_str }}'}})" class="persona-row{% if entry.is_active %} persona-row-active{% endif %}"><span class="persona-row-marker">{% if entry.is_active %}●{% else %}○{% endif %}</span><span class="persona-row-name">{% for seg in name_segments %}{% if seg.matched %}<mark>{{ seg.text }}</mark>{% else %}{{ seg.text }}{% endif %}{% endfor %}</span><span class="persona-row-description">{% for seg in description_segments %}{% if seg.matched %}<mark>{{ seg.text }}</mark>{% else %}{{ seg.text }}{% endif %}{% endfor %}</span></div>
