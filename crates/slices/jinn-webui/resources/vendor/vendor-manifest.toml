# The webui slice's vendored frontend assets.
#
# The pin gate: build.rs verifies every row's sha256 against the bytes
# on disk before embedding, and asserts gzip rows carry actual gzip
# bytes (1f 8b). This file is the tracked pin record; the `.gz` bytes
# the rows name are build output (gitignored) — `just webui-build`
# emits them from webui/client/src, stamps hash-bearing imports, and
# rewrites the marker-delimited section below. Never edit the rows by
# hand: edit the TypeScript under webui/client/src and run the recipe.
# A cargo build of this crate fails with directions when the bytes are
# missing, so fresh checkouts run `just webui-build` once before (or
# as part of) building.

