# The webui slice's vendored frontend library.
#
# Unlike the canvas manifest, this table is documentation of the pin, not
# the pin gate itself: the slice ships one file, gzip-committed at vendoring
# time (the raw dist is never committed), and `build.rs` verifies each row's
# sha256 against the bytes on disk before embedding. Update flow: replace
# the file with the new gzip of the new dist, recompute this row, done.

[[assets]]
served = "htmx.min.js"
sha256 = "acb9ff34b200f5016c8dae6ec658bd96050fe86fe090b06506de45d08348168c"
encoding = "gzip"
