# The webui slice's vendored frontend assets.
#
# Two families, one pin gate: build.rs verifies every row's sha256
# against the bytes on disk before embedding, and asserts gzip rows
# carry actual gzip bytes (1f 8b). Update flows:
#
# - Client bundle rows (between the BEGIN/END markers) are managed by
#   `just webui-build` — never edit them by hand; edit the TypeScript
#   under webui/client/src and run the recipe.
# - Other assets are third-party dists vendored by hand: gzip the new
#   dist, replace the file, recompute the row, done.

