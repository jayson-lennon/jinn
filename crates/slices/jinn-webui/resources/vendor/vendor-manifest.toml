# The webui slice's vendored frontend assets.
#
# The pin gate: build.rs verifies every row's sha256 against the bytes
# on disk before embedding, and asserts gzip rows carry actual gzip
# bytes (1f 8b). This file is the tracked pin record, and the bytes it
# names are tracked too — the Datastar browser bundle and the webapp
# icon set are committed vendored input (nothing in-repo regenerates
# them; the canvas vendor precedent), so hand-editing a row means
# re-pinning its sha256 by hand. There is no recipe that rewrites this
# file.

[[assets]]
served = "datastar.js"
sha256 = "ef62c7c7e7738d70b1e599226d209a1f2a526cbb004abcbe1d0d7d5601c074ab"
encoding = "gzip"

# Webapp install assets: the manifest the page shell links and the
# icons it names. Identity-encoded — PNG and JSON do not want gzip.
# Regenerating an icon (or the manifest) means re-pinning its sha256.

[[assets]]
served = "manifest.webmanifest"
sha256 = "fad0f242350aa197b857457bcf85e0f31681a12412549c967615afb59d9cd7fb"
encoding = "identity"

[[assets]]
