[package]
name = "jinn-apps"
version.workspace = true
edition.workspace = true
description = "The apps slice: saves agent-built HTML artifacts under the data dir and serves them back verbatim over loopback HTTP, with the <leader>sa picker."

[dependencies]
# The apps slice is a leaf: jinn-preferences-config ([apps] schema),
# jinn-slices (SliceHost, BusService), jinn-apps-msg (the contract), and
# jinn-common (AppPaths::apps_dir). No kernel, no canvas implementation
# crate — the /vendor/ parity is a build-time file path, not a
# dependency.
jinn-common = { workspace = true }
jinn-preferences-config = { workspace = true }
jinn-slices = { workspace = true }
jinn-apps-msg = { workspace = true }
jinn-config = { workspace = true }
jinn-picker = { workspace = true }
jinn-selection-widget = { workspace = true }
jinn-theme = { workspace = true }
jinn-app-state = { workspace = true }
axum = "0.8"
parking_lot = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }
tracing = { workspace = true }
marked-path = { workspace = true }
async-trait = { workspace = true }
trouper = { workspace = true }
ratatui = { workspace = true }
which = { workspace = true }
unicode-segmentation = { workspace = true }

[build-dependencies]
marked-path = { workspace = true }
# The build script verifies the shared vendor manifest against the bytes
# on disk (the same pin gate canvas's build runs) and generates the
# embedded asset table the server serves /vendor/ from.
sha2 = "0.10"
toml = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
jinn-testutil = { workspace = true }
jinn-cell-catalog = { workspace = true }
serde_json = { workspace = true }
trouper = { workspace = true }
toml_edit = { workspace = true }

[lints]
workspace = true
