[package]
name = "jinn-preferences"
version.workspace = true
edition.workspace = true
description = "The preferences slice: persists jinn.toml and state.toml (PreferencesActor + AppStateActor)."

[dependencies]
jinn-config = { workspace = true }
# Kernel dep is deliberate: both actors write AppState inline through
# `State` projections — `frontend.preferences` / `frontend.app_state`, the
# theme cell resolution in the app-state sync, and the project-picker
# reload after a preference save. See AGENTS.md §3 "one boundary = one
# actor": these are the authoritative writers for those fields.
jinn-kernel = { workspace = true }
jinn-preferences-config = { workspace = true }
jinn-boot-msg = { workspace = true }
jinn-preferences-msg = { workspace = true }
jinn-project = { workspace = true }
jinn-project-msg = { workspace = true }
jinn-slices = { workspace = true }
jinn-core-types = { workspace = true }
jinn-theme = { workspace = true }
jinn-theme-msg = { workspace = true }
jinn-persona-msg = { workspace = true }
# The skills picker's cell: a theme change must drop the preview lines it has
# already rendered in the old palette, and the cache now lives with the picker.
jinn-skills-msg = { workspace = true }
# The chat log's line cache, on the same reasoning: a theme change must drop
# the lines already rendered in the old palette, so the clear goes to the cell
# that owns them.
jinn-chat-log-view-msg = { workspace = true }
jinn-selection-widget = { workspace = true }
# The trouper runtime: ServiceActors, topics, schemas.
trouper = { workspace = true }
serde_json = { workspace = true }
error-stack = { workspace = true }
tracing = { workspace = true }
ratatui = { workspace = true }
rstest = { workspace = true }

[dev-dependencies]
dirs = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
