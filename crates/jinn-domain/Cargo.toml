[package]
name = "jinn-domain"
version.workspace = true
edition.workspace = true

[features]
# Opt-in: compiles the full 36-grammar tree-sitter set for markdown code-block
# highlighting instead of the curated default set (see root Cargo.toml).
syntax-all = ["ratatui-markdown/highlight-lang-all"]
# Opt-in: exposes the bus test harness (in-crate tests enable it via
# `cfg(test)`; downstream slice-crate tests opt in by feature).
test-harness = []

[dependencies]
# Internal deps
jinn-provider = { workspace = true }
jinn-common = { workspace = true }
jinn-core-types = { workspace = true }
jinn-slices = { workspace = true }
jinn-session-msg = { workspace = true }
jinn-provider-config = { workspace = true }
jinn-web-fetch = { workspace = true }
jinn-web-search = { workspace = true }
jinn-mcp = { workspace = true }
jinn-plugin = { workspace = true }
jinn-plugin-api = { workspace = true }
form_urlencoded = { workspace = true }
jinn-selection-widget = { workspace = true }
jinn-picker = { workspace = true }

jinn-theme = { workspace = true }
ratatui-markdown = { workspace = true }

# External deps
serde = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
derive_more = { workspace = true }
ratatui-which-key = { workspace = true }
uuid = { workspace = true }
ratatui = { workspace = true }
async-trait = { workspace = true }
wasmparser = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }
dirs = { workspace = true }
which = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
strip-ansi-escapes = { workspace = true }
tiktoken = { workspace = true }
textwrap = { workspace = true }
throbber-widgets-tui = { workspace = true }
humantime = { workspace = true }
fuzzy-matcher = { workspace = true }
parking_lot = { workspace = true }
libc = { workspace = true }
kanal = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
portable-pty = { workspace = true }
vt100 = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
anstyle-lossy = { workspace = true }
anstyle = { workspace = true }
reasoning-parser = "1.2"
regex = { workspace = true }
daow = { workspace = true }
tempfile = { workspace = true }
dashmap = { workspace = true }

# Schema + migrations — the single source of truth for the SQLite schema.
# Consumed by build.rs (compile-time validation DB) and by the runtime migrator.
# See the dao crate README for the schema-crate pattern.
jinn-session-schema = { workspace = true, features = ["testing"] }

# Actor framework
kameo = { workspace = true }
kameo_actors = { workspace = true }

# Actor canvas runtime (jinn slice actors ported onto it — see
# .plans/actor-canvas/plan.md)
trouper = { workspace = true }

# SQLite driver — dao wraps rusqlite but the migrator and tests use the raw
# `rusqlite::Connection` (via `pool.with_conn`) for FK toggles and row-by-row
# JSON surgery that dao's typed DAO layer doesn't cover.
rusqlite = { workspace = true }
[dev-dependencies]
wasm-encoder = { workspace = true }
indoc = "2"
rstest = { workspace = true }
jinn-testutil = { workspace = true }
jinn-mcp = { workspace = true, features = ["testkit", "server-testkit"] }
tokio = { workspace = true, features = ["test-util"] }
jinn-common = { workspace = true, features = ["testing"] }
trybuild = "1"
ctor = "0.8"
rustls = { workspace = true }
tracing-subscriber = { workspace = true }


[build-dependencies]
rusqlite = { workspace = true }
jinn-session-schema = { workspace = true }

# The build script runs on the host, so this edge links the *system*
# libsqlite3 on Linux/macOS — but Windows has no system SQLite import library,
# which failed the host link with LNK1181 (sqlite3.lib). Enable rusqlite's
# bundled build on Windows only so a from-source build needs no SQLite
# installation there; the extra host amalgamation compile is cached and only
# re-runs on cache-invalidating events (clean, toolchain/lockfile bumps).
[target.'cfg(windows)'.build-dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
# kill_tree provides Toolhelp32-based process-tree termination on Windows.
# Used by `common::process_kill` as the Windows counterpart to Unix's
# process-group kill. Only the default `blocking` feature is needed;
# the `tokio` feature is intentionally NOT enabled because kill-on-drop
# runs synchronously from a `Drop` impl (no async runtime context).
kill_tree = "0.2"

[lints]
workspace = true

# [lints.clippy]
# pedantic = { level = "warn", priority = -1 }
# result_large_err = "allow"
# field_scoped_visibility_modifiers = "allow"
# module_inception = "allow"
# must_use_candidate = "allow"
# missing_docs_in_private_items = "allow"
# doc_markdown = "allow"
# cast_possible_truncation = "allow"
# cast_sign_loss = "allow"
# cast_possible_wrap = "allow"
# return_self_not_must_use = "allow"
# single_match = "allow"
# struct_excessive_bools = "allow"
# needless_raw_string_hashes = "allow"
