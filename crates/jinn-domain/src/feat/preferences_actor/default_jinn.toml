# jinn default configuration
#
# This file is auto-generated on first run. Comments are preserved across
# saves, so feel free to annotate values that you have customized.
#
# Everything active below reflects the built-in defaults. Optional features
# ship as commented examples — lines ending in "(uncomment below to activate)"
# mark a block you can uncomment as-is. A test suite guarantees every example
# activates cleanly and that every supported key is documented here.

# ---------------------------------------------------------------------------
# General settings (top-level keys — must stay above any [section] header)
# ---------------------------------------------------------------------------

# Default execution timeout (seconds) for all builtin tool calls.
# Acts as a safety ceiling so a hung tool never stalls the turn
# indefinitely. Bash calls can override this per-call via the
# `max_duration_secs` tool argument.
tool_default_timeout_secs = 300

# Optional display and output tuning.
# (uncomment below to activate)
# tool_entry_max_lines = 12
# min_collapse_count = 5
# max_tool_output_lines = 2000
# max_tool_output_bytes = 51200
# disabled_tools = ["bash", "mcp__excalimate__draw"]
# disabled_skills = ["phased-task-loop"]

# `tool_entry_max_lines` caps how many lines of a tool call/result render in
# the chat log before truncation. `min_collapse_count` is the smallest number
# of contiguous excluded entries that collapse into a summary line.
# `max_tool_output_lines` / `max_tool_output_bytes` truncate captured tool
# output before the model ever sees it. `disabled_tools` / `disabled_skills`
# start NEW sessions with those names disabled (bare tool names or full MCP
# namespaces like "mcp__excalimate__draw"; entries that match nothing are
# harmless). Toggles inside a session override the disablement lists
# per-session and never write back here.

# ---------------------------------------------------------------------------
# Session lifecycle commands
# ---------------------------------------------------------------------------
# Lifecycle commands run at session startup and teardown. They allow you to
# setup and cleanup the environment.
#
# `setup_command` is ran when the session is created. `teardown_command` is ran
# when the session is "closed" or the command can be ran manually with the `t`
# keyboard shortcut.
#
# The `setup_command` can optionally end by printing the desired CWD and jinn
# will configure the session to use that CWD. This is useful when checking out
# a new branch in a new workspace and then switching to that workspace.
#
# If the `teardown_command` 
#
# Fossil SCM example
# (uncomment below to activate)
# [[session_lifecycle]]
# name = "fossil branch quickfix"
# description = "Open a new checkout + branch"
# setup_command = "mkdir <branch> && cd <branch> && fossil open ../jinn.fossil && fossil commit -m 'Open <branch>' --branch <branch> --allow-empty && just shm-target && echo ./<branch>"
# teardown_command = "cd <branch> && fossil merge trunk --force && fossil addremove && fossil commit -m 'Bring in latest trunk' && fossil update trunk && fossil merge <branch> && fossil addremove && fossil commit -m 'Merge <branch>' && fossil branch close <branch> && just unshm-target && cd .. && rm -rfv <branch>"

# Fossil repos. Project directory should be a parent folder of the repo:
#
# my_project/        <-- configured as the project directory in jinn
#    repo.fossil
#    checkouts_will_go_here_as_siblings/
#       .fslckout
#
[[session_lifecycle]]
name = "fossil branch checkout"
description = "Open a new checkout + branch"
setup_command = "mkdir <branch> && cd <branch> && fossil open ../<repo>.fossil && fossil commit -m 'Open <branch>' --branch <branch> --allow-empty && echo ./<branch>"
teardown_command = "fossil merge trunk --force && fossil addremove && fossil commit -m 'Bring in latest trunk' && fossil update trunk && fossil merge <branch> && fossil addremove && fossil commit -m 'Merge <branch>' && fossil branch close <branch> && cd .. && rm -rfv <branch>"

# Git worktrees. Project directory should be a parent folder of the repo:
#
# my_project/        <-- configured as the project directory in jinn
#    repo/           <-- your actual repo
#       .git/
#    worktrees_will_go_here_as_siblings/
#       .git/
#
[[session_lifecycle]]
name = "git worktree"
description = "Open a git worktree + branch"
setup_command = "cd <repo> && git worktree add -b <branch> ../<branch> && cd .. && echo $(pwd)/<branch>"
teardown_command = """bash -c 'git add -A && (git diff --cached --quiet || git commit -q -m "auto-commit at teardown") && git merge main && cd ../<repo> && git merge --squash <branch> && (git diff --cached --quiet || git commit -q -m "Merge <branch>") && git worktree remove ../<branch> && git branch -D <branch>'"""

# ---------------------------------------------------------------------------
# Project directories
# ---------------------------------------------------------------------------
# Projects are curated directories you frequently start sessions in. They
# appear in the project picker (`<leader>so`) and let you create a session
# directly at one of these paths without first changing the active session's
# directory.
#
# Add one block per directory. Duplicates are ignored.
#
# A project may also carry a `command_policy`: a list of blocked-command
# rules enforced by the bash tool for any session whose working directory
# falls inside the project. Each rule pairs a regex `pattern` (matched
# against the full command string; first match wins) with the corrective
# `message` returned to the agent when it matches. The command never runs.
#
# (uncomment below to activate)
# [[projects]]
# path = "~/code/jinn"
# command_policy = [{ pattern = 'cargo\s+(test|t)\b.*\s-p\b', message = "cargo test -p triggers a clean rebuild in this repo — run `just test` for the whole workspace instead." }]


# ---------------------------------------------------------------------------
# MCP servers (Model Context Protocol)
# ---------------------------------------------------------------------------
# jinn acts as an MCP *client*: each entry below declares a server it can
# connect to. Servers are OFF by default and must be enabled per-session
# (the choice is persisted with the session). When enabled for a session,
# jinn spawns/connects the server, advertises its tools to the model under
# a namespaced id `mcp__<name>__<tool>`, and forwards calls to it.
#
# Add one block per server. The `name` must be unique across all servers.
#
# Three transport modes are available:
#
#   stdio       (default) — jinn spawns the server and talks over its
#                          stdin/stdout. Most MCP servers support this.
#                          Omit the `transport` field entirely.
#
#   local_http  — jinn spawns the server (usually with a --port flag) and
#                connects over HTTP. jinn allocates a free port for each
#                session and expands the `<port>` token in both `args` and
#                `url` with that port. The host is parsed from the `url`.
#                Use this when the server supports HTTP mode and you want
#                stdout logging or HTTP transport.
#
#   remote_http — jinn connects to an already-running server at the
#                given `url`. No process is spawned; `command`/`args` are
#                not needed. Use this for servers running in Docker, on a
#                remote host, or as a system service.
#
# stdio example (transport omitted — it's the default)
# (uncomment below to activate)
# [mcp_server.excalimate]
# command = "npx"
# args = ["@excalimate/mcp-server", "--stdio"]
# auto_enable = false
#
# local_http example (jinn allocates the port, <port> is expanded)
# [mcp_server.excalimate_http]
# command = "npx"
# args = ["@excalimate/mcp-server", "--port", "<port>", "--host", "<ip>"]
# transport = "local_http"
# url = "http://127.0.0.1:<port>/mcp"
#
# remote_http example (no process spawned, connect to url)
# [mcp_server.remote]
# transport = "remote_http"
# url = "http://localhost:3001/mcp"
#
# HTTP headers (local_http and remote_http only; ignored on stdio).
# Values may embed ${ENV_VAR} tokens — expanded from your environment once
# at startup. Changing a variable requires a jinn restart to take effect.
# A variable that is unset or empty keeps the server from connecting and
# names the variable in the failure; header values are never logged.
#
# [mcp_server.remote.headers]
# Authorization = "Bearer ${MY_API_KEY}"
# X-Api-Key = "${OTHER_KEY}"

# ---------------------------------------------------------------------------
# Plugins — WASM components jinn runs in-process (sandboxed guests). Each
# entry names a .wasm file plus the directories it may access; jinn grants
# nothing else. Grants and http normally come from the plugin's own
# [package.metadata.jinn] manifest, embedded into the artifact at build and
# auto-applied by `jinn plugin add`/`install` — edit them here only to
# override that declaration. Nothing is granted implicitly: a plugin that
# wants its own writable scratch dir declares "<plugin_data_dir>:w".
# Plugins spawn at app start; installing or changing one requires a jinn restart.
#
# Path templates: <config_dir>, <data_dir>, <plugin_data_dir>.
# ---------------------------------------------------------------------------
# (uncomment below to activate)
# [plugin.my-plugin]
# wasm = "my-plugin.wasm"
# http = false
# grants = ["<config_dir>/themes", "<data_dir>/notes:w"]
# config = { any = "toml passed through to the guest" }
# enabled = true

# Compaction command + auto compaction.
[compaction]
# Provider/model used for compaction summarization (e.g.
# "anthropic/claude-sonnet-4-20250514"). Falls back to the session model
# when unset or unavailable.
# (uncomment below to activate)
# model = "openrouter/anthropic/claude-sonnet-4-20250514"
# Automatically compact the conversation when the used context window exceeds
# this usage percentage. Recommend no higher than 0.85 to account for drift in
# token calculations between models and providers (jinn applies a single token
# calculation across the board).
threshold = 0.7
# Number of tokens to reserve during compaction. This will keep up to the
# `reserve_tokens` worth of recent messages so the model doesn't lose track of
# what it was doing.
reserve_tokens = 20000
# Fallback context window size (in tokens) when the provider does not report one.
fallback_context_window = 150000

# Policy for retrying failed provider requests.
[request_retry]
# Retry the request this amount of times before aborting.
max_retries = 5
base_delay_secs = 2
max_delay_secs = 60

# web-fetch tool.
[web_fetch]
# Backend used by the web_fetch tool. One of:
#   "http"           - plain HTTP requests (fast, but frequently blocked).
#   "headless-chrome" - shared headless Chromium (slower, renders JS, anti-detection).
#   "headed-chrome"   - shared HEADED Chromium with a persistent, manually-warmable
#                      profile. A real window appears so you can solve interstitial
#                      challenges (Cloudflare/Turnstile) once; the cleared cookies
#                      persist across restarts. Shared with web_search when it picks
#                      the same mode.
#
# "http" can be used when most of your requests hit static or server-rendered
# pages. Note that many sites will block bot traffic and so the "http" backend
# will fail regularly.
#
# The browser backends are significantly slower than "http", but have a higher
# success rate since they use a real browser with JavaScript support. The
# browser is started on-demand, so the first request takes a while and
# subsequent requests are quicker.
backend = "headless-chrome"

# Shared browser launch configuration. Consumed by both web-fetch and
# web-search when their `backend` selects a browser ("headless-chrome" or
# "headed-chrome"). Ignored entirely by the "http" backend.
[browser]
# Which binary to launch. One of:
#   "auto"     - prefer installed Google Chrome, fall back to bundled Chromium.
#   "chrome"   - require an installed Google Chrome; error if missing.
#   "chromium" - use the bundled / auto-discovered Chromium.
binary = "auto"

# Seconds to wait for an interstitial challenge (Anubis PoW, Cloudflare) to
# clear before giving up. Only used by the browser backends.
anubis_timeout_secs = 30

# Optional browser overrides.
# (uncomment below to activate)
# user_agent = "Mozilla/5.0 ... Chrome/138.0.0.0 Safari/537.36"
# challenge_wait_secs = 120
# settle_secs = 5
# keep_tabs_open = false

# `user_agent` overrides the OS-matched Chrome user agent derived from the
# detected binary version. Applies to BOTH the browser backends AND the
# "http" backend (so web-search over HTTP also sends a current, realistic
# user agent instead of a stale one). `challenge_wait_secs` is how long a
# headed browser waits for a human to solve a bot challenge; `settle_secs`
# lets a slow single-page app finish rendering before the challenge
# fallback judges the page; `keep_tabs_open = true` leaves browser tabs
# open after a fetch so you can inspect what the site served.

# Web search via DuckDuckGo (provider-independent). Unlike
# [openrouter_web_search] below, this works with any provider (zai,
# OpenRouter, etc.) because it scrapes DuckDuckGo's HTML endpoint directly.
# Exposed to the model as the `web-search` tool.
[web_search]
# Backend used by the web_search tool. Same options as [web_fetch].backend:
#   "http" | "headless-chrome" | "headed-chrome"
# Defaults to "http" (plain requests) since search needs no JS rendering by
# default. Switch to a browser backend if DuckDuckGo starts blocking you.
backend = "http"
# Maximum number of results returned per search.
max_results = 10
# DuckDuckGo region code. "wt-wt" = global; "us-en" = US English.
region = "wt-wt"
# Whether safe search is on.
safe_search = true


# OpenRouter web search. Only valid when using OpenRouter as the provider.
[openrouter_web_search]
# Search engine used by the openrouter_web_search tool. One of:
# - "exa",
# - "firecrawl"
# - "parallel"
# - "native"
# - "auto"
engine = "exa"

# Optional OpenRouter web-search tuning.
# (uncomment below to activate)
# max_results = 5
# max_total_results = 20
# search_context_size = "medium"
# allowed_domains = ["example.com", "docs.example.com"]
# excluded_domains = ["pinterest.com"]

# `max_results` caps results per search call (1-25); `max_total_results`
# caps results across all searches in one request. `search_context_size`
# is "low", "medium", or "high" (how much context the engine retrieves;
# unset lets OpenRouter pick adaptively). `allowed_domains` /
# `excluded_domains` restrict results to (or away from) the listed domains.

# Discord bot frontend.
#
# When enabled, the TUI process also starts a Discord bot that drives the same
# running jinn instance. Each Discord thread maps 1:1 to a jinn session; the bot
# runs the lifecycle chosen on `/new` (from the [[session_lifecycle]] entries
# above, plus an implicit "blank" option) and replies with the final assistant
# message (or error) on each turn.
#
# <M-c>/<M-d> CWD selection
[cwd_selector]
# Shell command template run by the cwd_selector tool. `{path}` is replaced
# with the starting directory. Must print a single absolute path on stdout.
command = "find -L {path} -type d 2>/dev/null | fzf --no-multi"

# The minimap uses colors (dark to light) to mark the size of a particular
# message.
[minimap]
#  Messages `max_tokens` or higher will always be the lightest color.
max_tokens = 2000

# Interactive terminal panes.
# (uncomment below to activate)
# [interactive_term]
# control_toggle_key = "<c-g>"
# settle_quiet_ms = 400
# settle_max_wait_ms = 3000

# `control_toggle_key` toggles terminal control mode in both directions
# (notation follows the keymap). `settle_quiet_ms` is how many milliseconds
# of output silence a blocking call waits for before returning;
# `settle_max_wait_ms` is the hard cap on any single settle wait, for
# programs that never stop repainting (htop, btop).

# ---------------------------------------------------------------------------
# Auto-prune rules
# ---------------------------------------------------------------------------
#
# Each rule removes specific messages from the conversation history. Disable
# any rule by setting `enabled = false`.

[auto_prune]
# Token threshold for accumulating pruner context-override mutations before applying them.
# Mutations are held until their deduplicated token total reaches this value, reducing
# server-side KV-cache rebuilds from frequent small prunes. Default: 10000.
accumulation_threshold_tokens = 150000

# ---------------------------------------------------------------------------
# Prunes "edit" and "write" tool calls+results for a file if it is subsequently
# read.
[auto_prune.edit_read]
enabled = true
# Only prune after `min_age` messages.
min_age = 50

# ---------------------------------------------------------------------------
# Prunes "read" tool calls+results for a file after `threshold` number of
# edits/writes.
[auto_prune.read_edit]
enabled = true
# Number of edits or writes before the "read" becomes stale.
threshold = 2
# Only prune after `min_age` messages.
min_age = 50

# ---------------------------------------------------------------------------
# User-supplied regex rules.
[auto_prune.regex]
enabled = true

[[auto_prune.regex.rules]]
# Regex pattern to check
pattern = "cargo test"
# Tool name to check
tool_name = "bash"
# Keep this many matching instances.
keep_last = 2
# Don't trigger until this many messages/tool calls have elapsed
min_age = 50

[[auto_prune.regex.rules]]
pattern = "cargo check"
tool_name = "bash"
keep_last = 1
min_age = 50

[[auto_prune.regex.rules]]
pattern = "cargo clippy"
tool_name = "bash"
keep_last = 1
min_age = 50

# ---------------------------------------------------------------------------
# Removes failed `edit` tool result and corresponding call.
[auto_prune.broken_edit]
enabled = true
# Only prune a broken-edit pattern when at least this many tail entries exist.
min_age = 10


# ---------------------------------------------------------------------------
# All todo/task list tool calls return the entire list. This pruner keeps only the most recent todo call.
[auto_prune.todo]
enabled = true
# Don't trigger until this many messages/tool calls have elapsed.
# (uncomment below to activate)
# min_age = 50

# ---------------------------------------------------------------------------
# Prunes old edit and write tool calls + tool results.
[auto_prune.double_edit]
enabled = true
# The number of writes/edits to keep for any particular file
max_file_edits = 2
# Don't trigger until this many messages/tool calls have elapsed
min_age = 20

# ---------------------------------------------------------------------------
# Prunes old reads of files.
[auto_prune.consecutive_reads]
enabled = true
# Keep up to 5 reads per file.
keep_last = 5
# Don't trigger until this many messages/tool calls have elapsed. This worker
# should use a somewhat higher min_age threshold in case the agent reads small
# chunks of large files multiple times.
min_age = 80

# ---------------------------------------------------------------------------
# Prunes tool calls + tool results.
[auto_prune.tool_age_window]
enabled = true
# Don't trigger until this many messages/tool calls have elapsed. This worker
# should use a higher value since it prunes indiscriminately.
min_age = 150

# ---------------------------------------------------------------------------
# Prunes short assistant entries. There are common during tool loops when then
# agent is "thinking out loud".
[auto_prune.trivial_assistant]
enabled = true
# Prune entries that have up to this many tokens.
max_tokens = 80
# Don't trigger until this many messages/tool calls have elapsed. This worker
# should use a high-ish value here so the agent doesn't lose track of what it's
# working on.
min_age = 100

# ---------------------------------------------------------------------------
# Prunes large assistant entries.
#
# Sometimes the assistant thinks "out loud" with large entries (which we want
# to prune). However, large entries are also typically associated with direct
# responses to user messages and are of more importance (like plans or
# explanations or code samples that we want to keep).
#
# This pruner calculates a `radius` of entries anchored from all user messages
# and the first/last message in the entire chat history. If the assistant entry
# is outside the radius, it gets pruned. If it's inside, it stays. The size of
# the assistant message is the `trivial_assistant` pruner config `max_tokens`
# size + 1.
#
# Here's a visual to help explain:
#
#  u = user message
#  A = assistant message
#  t = tool call
#  . = outside radius
#  - = inside radius
#
#         keep                            keep
#         v     v                         v  v
#        uAtttttA.........................AttAttu
# anchor ^-------|         prune         |------^ user message anchor

[auto_prune.anchored_assistant]
enabled = true
# Candidate message must be at least this old before prune-eligible.
min_age = 50
# Deprecated: the radius is now sourced from anchor_shield.radius below.
# Kept for backward compatibility; uncommenting has no effect.
# (uncomment below to activate)
# radius = 100

# ---------------------------------------------------------------------------
# Protects Assistant, Tool Calls, and Tool Result entries around user messages
# from being excluded from context by marking them as ForceIncluded.
#
# Here's a visual to help explain:
#
#  u = user message
#  A = assistant message
#  t = tool call
#  . = outside radius
#  - = inside radius
#
#  anchor                                 user message anchor
#   v                                      v
#   uAtttttA.........................AttAttu
#   --------|     outside radius    |-------
#  protected                         protected
[auto_prune.anchor_shield]
enabled = true
# Number of entries around a user message that are shielded from exclusion by
# other workers.
radius = 20
