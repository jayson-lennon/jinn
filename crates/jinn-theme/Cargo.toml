[package]
name = "jinn-theme"
version.workspace = true
edition.workspace = true

[dependencies]
ratatui = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
anstyle = { workspace = true }
anstyle-lossy = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }
jinn-selection-widget = { workspace = true, optional = true }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }



[lints.clippy]
pedantic = { level = "warn", priority = -1 }
result_large_err = "allow"
field_scoped_visibility_modifiers = "allow"
module_inception = "allow"
must_use_candidate = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
return_self_not_must_use = "allow"
single_match = "allow"
struct_excessive_bools = "allow"

[features]
# `entry` pulls in the picker-facing ThemeEntry (ratatui/crossterm world);
# guests use the crate loader-only.
entry = ["dep:jinn-selection-widget"]
default = ["entry"]
