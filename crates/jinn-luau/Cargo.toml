[package]
name = "jinn-luau"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
mlua = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
# The browser family rides the shared daemon client. `default-features
# = false` keeps the daemon feature (chaser-oxide, axum, tokio) out of
# the lean mlua build — this crate is a client, never the owner.
jinn-browser = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }
marked-path = { workspace = true }
# Test-only use (the provider install mirrors `main`), but a `[dev-dependencies]`
# entry cannot feed a non-test module path cleanly here; a normal dependency
# costs nothing on top of reqwest's graph.
rustls = { workspace = true }
# `jinn luau serve`: the rmcp stdio server handler + transport, and the
# runtime its futures run on. Both already ride the jinn binary through
# the other MCP crates — no new external graph.
rmcp = { workspace = true, features = ["server", "transport-io"] }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
jinn-testutil = { workspace = true }
jinn-common = { workspace = true }
mockito = { workspace = true }
# The lib tests' rustls-provider hook (see src/lib.rs).
ctor = "0.8"

[lints]
workspace = true
