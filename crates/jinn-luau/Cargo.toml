[package]
name = "jinn-luau"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
mlua = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde_json = { workspace = true }
toml = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }
marked-path = { workspace = true }
