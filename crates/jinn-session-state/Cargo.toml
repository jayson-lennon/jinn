[package]
name = "jinn-session-state"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Authoritative live session aggregate, session registry, runtime state, and snapshot contracts."

[dependencies]
marked-path = { workspace = true }
jinn-chat-input-msg = { workspace = true }
jinn-bot-msg = { workspace = true }
jinn-chat-log-view-msg = { workspace = true }
jinn-context = { workspace = true }
jinn-core-types = { workspace = true }
jinn-session-history = { workspace = true }
jinn-skills-msg = { workspace = true }
jinn-session-lifecycle-msg = { workspace = true }
jinn-workflows-msg = { workspace = true }
jinn-session-msg = { workspace = true }
jinn-session-store-msg = { workspace = true }
jinn-slices = { workspace = true }
jinn-token-count-msg = { workspace = true }
jinn-tools-msg = { workspace = true }
jinn-turn-dispatch-msg = { workspace = true }
# The pins section's label: ANSI is stripped from entry text before it is
# truncated to a display width, measured per grapheme.
strip-ansi-escapes = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
async-trait = { workspace = true }
error-stack = { workspace = true }
jiff = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
wherror = { workspace = true }

tempfile = { workspace = true }
[dev-dependencies]
jinn-llm-support = { path = "../jinn-llm-support" }
jinn-provider = { workspace = true }
# Test-only: a session test that writes a chat-input draft needs the cell
# that holds it, and the catalog is the only thing that registers one.
jinn-cell-catalog = { workspace = true }
rstest = { workspace = true }
jinn-testutil = { workspace = true }

[lints]
workspace = true
