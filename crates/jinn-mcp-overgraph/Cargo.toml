[package]
name = "jinn-mcp-overgraph"
version.workspace = true
edition.workspace = true

[dependencies]
marked-path = { workspace = true }
parking_lot = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-io"] }
overgraph = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "io-std"] }
serde_json = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }
tracing = { workspace = true }
jinn-common = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
tokenizers = { workspace = true }
hf-hub = { workspace = true }

[features]
# Compiles the parity integration test, which needs the real embedder and
# the cached bge-small weights (and downloads them if the cache is cold).
# Run with: cargo test -p jinn-mcp-overgraph --features embed-parity
embed-parity = []

[dev-dependencies]
rstest = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tempfile = { workspace = true }
jinn-testutil = { workspace = true }
jinn-mcp = { workspace = true, features = ["testkit"] }
overgraph = { workspace = true }
serde_json = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-io"] }
[lints]
workspace = true
