[package]
name = "jinn-preferences-config"
version.workspace = true
edition.workspace = true

[dependencies]
# Internal deps (kernel-free: no jinn-kernel)
jinn-config = { workspace = true }
jinn-common = { workspace = true }
jinn-core-types = { workspace = true }
jinn-slices = { workspace = true }
# The attendant entry's activation/trigger vocabulary; the shape follows the
# session state so a saved attendant restores exactly as it ran.
jinn-attendant-msg = { workspace = true }

# The trouper runtime: crossing_schema! impls for the two protocol commands.
trouper = { workspace = true }

# External deps
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
dirs = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
error-stack = { workspace = true }
wherror = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
# Compiling the shipped `[[stream_rules.entry]]` patterns in
# template_validation_tests — a pattern the engine rejects is inert at
# runtime, so a typo would ship a rule that silently never fires.
regex = { workspace = true }

[lints]
workspace = true
