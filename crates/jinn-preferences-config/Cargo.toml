[package]
name = "jinn-preferences-config"
version.workspace = true
edition.workspace = true

[dependencies]
marked-path = { workspace = true }
# Internal deps (kernel-free: no jinn-kernel)
jinn-config = { workspace = true }
jinn-common = { workspace = true }
jinn-core-types = { workspace = true }
jinn-slices = { workspace = true }
# The bot entry's activation/trigger vocabulary; the shape follows the
# session state so a saved bot restores exactly as it ran.
jinn-bot-msg = { workspace = true }
# The dictation tuning options: the `[dictation]` section's endpointing
# and decode keys default from (and convert into) the backend contract's
# pure-data options struct.
jinn-dictation-backend = { workspace = true }

# The trouper runtime: crossing_schema! impls for the two protocol commands.
trouper = { workspace = true }

# External deps
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
error-stack = { workspace = true }
wherror = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
jinn-testutil = { workspace = true }
# Compiling the shipped `[[stream_rules.entry]]` patterns in
# template_validation_tests — a pattern the engine rejects is inert at
# runtime, so a typo would ship a rule that silently never fires.
regex = { workspace = true }

[lints]
workspace = true
