[package]
name = "jinn-common"
version.workspace = true
edition.workspace = true

[dependencies]
toml = { workspace = true }
toml_edit = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The shell resolver normalizes a configured path's separators through
# marked-path, so the workspace has one implementation of that rewrite.
marked-path = { workspace = true }
# `binary_detect`'s WhichProbe resolves PATH names for browser binaries.
which = { workspace = true }
# Not unix-only: `process_kill::kill_process_tree` takes a
# `&mut tokio::process::Child` on every platform.
tokio = { workspace = true }
# `system_resource`'s soft-fail loader warns on absent/unreadable optional
# resources on every platform, so tracing is unconditional (kill_tree's
# Windows-only use was previously the only call site).
tracing = { workspace = true }

tempfile = { workspace = true }
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = []
# Exposes test-only helpers (e.g. `AppPaths::set_home_dir_for_test`) so that downstream
# crates can use them from their own test suites. `#[cfg(test)]` does not propagate
# across crate boundaries, so this feature is the boundary instead.
testing = []

[dev-dependencies]
jinn-testutil = { workspace = true }
rstest = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Toolhelp32-based process-tree termination, the Windows counterpart to
# Unix's process-group kill. Only the default `blocking` feature is needed:
# kill-on-drop runs synchronously from a `Drop` impl (no async runtime).
kill_tree = "0.2"

[lints]
workspace = true
