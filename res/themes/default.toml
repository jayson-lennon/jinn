# Default — the built-in jinn theme
# This file is the single source of truth for the default theme colors.
# Installed to ~/.config/jinn/themes/default.toml

# Borders & focus
focus_accent = "yellow"
border_unfocused = "darkgray"
popup_title = "green"
sidebar_resize_accent = "green"

# Text
primary_text = [220, 220, 220]
muted_text = [116, 116, 116]
subagent_fg = [178, 158, 240]
subagent_bg = [70, 58, 105]
bot_fg = [255, 105, 180]
bot_bg = [56, 48, 17]
bot_paused = [128, 132, 144]
bot_parent_trigger = [255, 105, 180]
error_text = "red"
dormant_fg = [140, 140, 140]

# Status
success = "green"
warning = "yellow"
streaming = "cyan"
node_awaiting_input = "cyan"

# Chat log backgrounds
gutter_bg = [25, 27, 30]
gutter_context_included = [16, 116, 127]
user_block_bg = [52, 53, 65]
# Dark purple: near-black like the user block but purple-biased, so
# inter-session messages read as machine-sent rather than typed.
intersession_bg = [59, 42, 65]
# Muted grey for jinn-authored bookkeeping (canvas-metrics) inside user
# entries: present but quiet, so typed words stay the loudest thing.
# Truecolor on purpose — ANSI "gray" is palette slot 7, which most
# terminals render near-white (#e5e5e5) and indistinguishable from text.
metrics_fg = [140, 140, 140]
tool_fg = [97, 105, 117]
tool_success_bg = [44, 55, 44]
tool_failure_bg = [60, 40, 40]
tool_pending_bg = [45, 45, 50]
challenge_alert_bg = [255, 200, 0]
challenge_alert_fg = [16, 16, 16]
compaction_block_bg = [60, 50, 80]
# Dark amber: near-black like the user block's base value but yellow-biased,
# so harness rule guidance reads as steering rather than typed input.
rule_interrupt_bg = [72, 61, 20]
sources_header_bg = [74, 79, 170]
sources_header_fg = [255, 255, 255]
truncation_fg = [83, 83, 83]

# Picker
picker_active_marker = "green"
picker_selected_bg = [70, 72, 78]
picker_highlight_bg = [68, 71, 80]

# Tab bar
tab_active_fg = "black"
tab_active_bg = "yellow"
tab_inactive_fg = "gray"

# Selection highlight
selection_fg = [220, 220, 220]
selection_bg = [80, 82, 88]

# In-flight session tint (archive/teardown dispatched, not yet finished)
in_flight_bg = [50, 52, 58]
in_flight_fg = [200, 200, 200]

# Provider picker
accent_action = [255, 165, 0]
age_fresh = "lightgreen"
bot_option_active = "lightgreen"
age_stale = "red"

# Scroll indicator
scroll_indicator_bg = "black"

# Input mode badge (queue vs steer)
input_mode_queue = [0, 255, 100]
input_mode_steer = [202, 92, 230]

# Info popup (audit, debug)
infopopup_bg = [40, 44, 52]
infopopup_title = "yellow"
infopopup_border = "cyan"
infopopup_fg = [220, 220, 220]

# Quake bar (global overlay console)
quake_bar_bg = [42, 28, 24]

# Dictation meter (recording strip background)
# Dark red reads as hot-mic while leaving the cyan streaming bars at
# full contrast — red+green is not a colorblind-safe pairing.
meter_bg = [138, 31, 31]
