[package]
name = "jinn"
version.workspace = true
edition.workspace = true
resolver = "3"
default-run = "jinn"
repository = "https://github.com/jayson-lennon/jinn"

[features]
default = []
syntax-all = ["jinn-domain/syntax-all"]

# cargo-binstall artifact discovery. The binary is built locally and
# pushed to GitHub releases (see `just build-release-tarball` / `just release`).
# `disabled-strategies` ensures binstall never silently falls back to
# building from source or hitting the third-party quick-install host.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]


[workspace]
# `crates/jinn-*` (not `crates/*`) so the glob never matches the `crates/slices/`
# container directory, which holds the slice crates matched by `crates/slices/*`.
members = ["crates/jinn-*", "crates/slices/*", "plugins/*", "vendor/*"]


[workspace.package]
version = "0.118.0"
edition = "2024"
publish = false

[profile.release]
strip = true
opt-level = "s"    # optimize for size
lto = true
codegen-units = 1

[profile.dev]
debug = 0

# wasmtime's JIT-compile step dominates debug-build plugin startup (~10x
# slower unoptimized). Optimize wasmtime's compiler/runtime crates in dev
# builds so plugin compilation is close to release speed; the cache (see
# PluginEngine) then makes later launches skip compilation entirely.
# (Cargo rejects globs in profile package tables, so enumerate the family.)
[profile.dev.package.wasmtime]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2
[profile.dev.package.wasmtime-internal-jit-debug]
opt-level = 2
[profile.dev.package.wasmtime-internal-unwinder]
opt-level = 2
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-assembler-x64]
opt-level = 2
[profile.dev.package.wasmparser]
opt-level = 2

[patch.crates-io]
tiktoken = { path = "vendor/tiktoken" }

[lib]
path = "src/lib.rs"

[dependencies]
jinn-persona = { workspace = true }
jinn-token-count = { workspace = true }
jinn-mcp-slice = { workspace = true }
jinn-theme-slice = { workspace = true }
jinn-cli = { workspace = true }
jinn-chat-input = { workspace = true }
jinn-chat-log-view = { workspace = true }
jinn-scope-focus = { workspace = true }
jinn-sidebar = { workspace = true }
jinn-cwd = { workspace = true }
jinn-plugin = { workspace = true }
jinn-plugin-api = { workspace = true }
jinn-tui = { workspace = true }
jinn-domain = { workspace = true }
jinn-dashboard = { workspace = true }
jinn-discord = { workspace = true }
jinn-discord-msg = { workspace = true }
jinn-quake-bar = { workspace = true }
jinn-status-bar = { workspace = true }
jinn-session-msg = { workspace = true }
jinn-session-init = { workspace = true }
jinn-slices = { workspace = true }
jinn-picker = { workspace = true }

clap_complete = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
kameo = { workspace = true }
kameo_actors = { workspace = true }
trouper = { workspace = true }
async-trait = { workspace = true }
wherror = { workspace = true }
kanal = { workspace = true }
error-stack = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
reqwest = { workspace = true }
rustls = { workspace = true }
dirs = { workspace = true }
jiff = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nu-ansi-term = { workspace = true }
clap = { workspace = true }
clap-verbosity-flag = { workspace = true }
ratatui-which-key = { workspace = true }
ratatui-spatial-splits = { workspace = true }

tempfile = { workspace = true }
dotenvy = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
mockito = { workspace = true }
kameo = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tempfile = { workspace = true }
ctor = "0.8"
rustls = { workspace = true }
# Slice-composition integration tests (tests/slices.rs) drive the real
# slices; integration targets are not compiled by `just check`, so the
# kernel/tui crates above stay slice-free.
jinn-dashboard = { workspace = true }
jinn-quake-bar = { workspace = true }
jinn-discord = { workspace = true }
jinn-session-init = { workspace = true }
jinn-chat-input = { workspace = true }
jinn-chat-log-view = { workspace = true }
jinn-scope-focus = { workspace = true }
jinn-status-bar = { workspace = true }
jinn-testutil = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }

[workspace.dependencies]

# Internal
jinn-domain = { path = "crates/jinn-domain" }
jinn-discord = { path = "crates/slices/jinn-discord" }
jinn-discord-msg = { path = "crates/slices/jinn-discord-msg" }
jinn-common = { path = "crates/jinn-common" }
jinn-core-types = { path = "crates/jinn-core-types" }
jinn-dashboard = { path = "crates/slices/jinn-dashboard" }
jinn-theme-slice = { path = "crates/slices/jinn-theme" }
jinn-persona = { path = "crates/slices/jinn-persona" }
jinn-token-count = { path = "crates/slices/jinn-token-count" }
jinn-quake-bar = { path = "crates/slices/jinn-quake-bar" }
jinn-session-init = { path = "crates/slices/jinn-session-init" }
jinn-chat-input = { path = "crates/slices/jinn-chat-input" }
jinn-chat-log-view = { path = "crates/slices/jinn-chat-log-view" }
jinn-scope-focus = { path = "crates/slices/jinn-scope-focus" }
jinn-sidebar = { path = "crates/slices/jinn-sidebar" }
jinn-cwd = { path = "crates/slices/jinn-cwd" }
jinn-status-bar = { path = "crates/slices/jinn-status-bar" }
jinn-slices = { path = "crates/jinn-slices" }
jinn-session-msg = { path = "crates/jinn-session-msg" }
jinn-session-schema = { path = "crates/jinn-session-schema" }
jinn-provider-config = { path = "crates/jinn-provider-config" }
ratatui-markdown = { path = "vendor/ratatui-markdown", features = [
  "markdown",
  "highlight",
  "highlight-pest",
  "mermaid",
  "highlight-lang-rust",
  "highlight-lang-python",
  "highlight-lang-javascript",
  "highlight-lang-typescript",
  "highlight-lang-bash",
  "highlight-lang-json",
  "highlight-lang-toml",
  "highlight-lang-go",
  "highlight-lang-c",
  "highlight-lang-cpp",
] }
jinn-provider = { path = "crates/jinn-provider" }
jinn-tui = { path = "crates/jinn-tui" }
jinn-cli = { path = "crates/jinn-cli" }
jinn-selection-widget = { path = "crates/jinn-selection-widget" }
jinn-picker = { path = "crates/jinn-picker" }
jinn-testutil = { path = "crates/jinn-testutil" }

jinn-theme = { path = "crates/jinn-theme" }
jinn-mcp = { path = "crates/jinn-mcp" }
jinn-mcp-slice = { path = "crates/slices/jinn-mcp-slice" }
jinn-plugin-api = { path = "crates/jinn-plugin-api" }
jinn-plugin = { path = "crates/jinn-plugin" }
wasm-encoder = "=0.252.0"
wasmparser = "=0.252.0"
wasmtime = { version = "47", features = ["component-model-async", "cache"] }
wasmtime-wasi = { version = "47", features = ["p3"] }
wasmtime-wasi-http = { version = "47", features = ["p3"] }

# Error handling
wherror = "2.3.1"
error-stack = { version = "0.8", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# MCP client protocol
rmcp = { version = "3.0.0-beta.2", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }

# Async / channels
tokio = { version = "1", features = ["full"] }
kanal = "0.1"
dashmap = "6"
futures = "0.3"


# Actor framework
kameo = { version = "0.20", features = ["tracing"] }
kameo_actors = "0.5"

# The trouper actor runtime (published to crates.io; the SDK workspace
# remains the development home — see .plans/actor-canvas/plan.md)
trouper = "0.1.0"

# PTY + terminal emulation (interactive_term tool)
portable-pty = "0.9"
vt100 = "0.15"

# UI
ratatui = { version = "0.30.0", default-features = false, features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-which-key = "0.14.0"
ratatui-spatial-splits = "0.2.0"
throbber-widgets-tui = "0.11"


# State
parking_lot = "0.12"
arc-swap = "1"

# Binary discovery
which = "7"


# Time
jiff = { version = "0.2", features = ["serde"] }
humantime = "2"

# DX
derive_more = { version = "2", features = ["debug", "display"] }
rstest = "0.26"
tempfile = "3"

# CLI
clap = { version = "4", features = ["derive"] }
clap-verbosity-flag = "3"
clap_complete = "4"

# Other
dirs = "6"
toml = "0.8"
toml_edit = "0.22"
dotenvy = "0.15"
unicode-segmentation = "1"
unicode-width = "0.2"
strip-ansi-escapes = "0.2"
textwrap = "0.16"
tree-sitter = "0.26"
tree-sitter-python = "0.25"
fuzzy-matcher = "0.3"
url = "2"
form_urlencoded = "1"
async-trait = "0.1"
dialoguer = "0.12"
arboard = "3"
sha2 = "0.10"
glob = "0.3"
libc = "0.2"
rand = "0.9"
mockito = "1.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "form", "json", "stream"] }
# Pin the rustls crypto provider to `ring`. reqwest's `rustls` feature hard-wires
# the aws-lc-rs provider (whose sys crate compiles ~170s of C/asm per clean
# build); `rustls-no-provider` + this explicit dep makes `ring` the crate-level
# default provider instead. ring is already in the graph for serenity and
# headless_chrome, so this adds no new compilation.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scraper = "0.27"
anstyle-lossy = "1"
anstyle = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nu-ansi-term = "0.50"

# Proc-macro
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# UUID
uuid = { version = "1.23.1", features = ["v4", "v5", "v7", "serde"] }

# Tokenization
tiktoken = "3"
base64 = "0.22"
regex = "1"
petgraph = "0.7"
tokio-util = "0.7"
csv = "1"
ctrlc = "3"
comfy-table = "7"
# Database
daow = "0.2.0"
# `bundled` is deliberately NOT in this spec for the host-side graph: host
# consumers (build scripts, daow's proc-macro validation) link the system
# libsqlite3 on Linux/macOS — a bundled build there would recompile the whole
# SQLite amalgamation for the host on every clean build. The runtime link
# still gets `bundled` (a self-contained binary) through daow's own
# `bundled-sqlite` feature, which unions across the target-side graph.
# resolver v3 keeps host and target resolution separate, which is what makes
# this split possible.
#
# Windows exception: the host link used to fail there with LNK1181 — Windows
# has no system SQLite import library to link. Both host edges (this crate's
# build-dependencies and daow-macros' windows-scoped dependency) therefore
# enable `bundled` under cfg(windows) only. Windows pays one extra host
# amalgamation compile on clean builds; Linux/macOS are unchanged.
rusqlite = { version = "0.40", default-features = false, features = ["cache"] }

# Discord bot
poise = "0.6"
[workspace.lints.rust]
missing_docs = "allow"
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
wildcard_imports = "allow"
match_wildcard_for_single_variants = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"
implicit_hasher = "allow"
single_match = "allow"
single_match_else = "allow"
min_ident_chars = "allow"
rest_pat_in_fully_bound_structs = "allow"

allow_attributes = "warn"
allow_attributes_without_reason = "deny"
as_underscore = "deny"
clone_on_ref_ptr = "allow"
create_dir = "deny"
dbg_macro = "warn"
else_if_without_else = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"
exit = "deny"
expect_used = "warn"
field_scoped_visibility_modifiers = "warn"
filetype_is_file = "warn"
float_cmp_const = "deny"
get_unwrap = "deny"
if_then_some_else_none = "warn"
impl_trait_in_params = "deny"
integer_division = "allow"
large_include_file = "deny"
let_underscore_must_use = "allow"
lossy_float_literal = "deny"
map_err_ignore = "deny"
map_with_unused_argument_over_ranges = "warn"
missing_assert_message = "warn"
missing_docs_in_private_items = "allow"
mixed_read_write_in_expression = "warn"
multiple_unsafe_ops_per_block = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
needless_raw_strings = "allow"
needless_raw_string_hashes = "allow"
non_zero_suggestions = "deny"
too_many_arguments = "allow"
panic = "warn"
panic_in_result_fn = "deny"
partial_pub_fields = "deny"
pathbuf_init_then_push = "warn"
print_stderr = "warn"
print_stdout = "warn"
pub_with_shorthand = "allow"
rc_buffer = "warn"
rc_mutex = "deny"
redundant_test_prefix = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "warn"
return_and_then = "warn"
same_name_method = "warn"
str_to_string = "warn"
string_add = "warn"
string_slice = "deny"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unneeded_field_pattern = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unused_trait_names = "allow"
unwrap_in_result = "deny"
use_debug = "warn"
verbose_file_reads = "warn"

indexing_slicing = "deny"

